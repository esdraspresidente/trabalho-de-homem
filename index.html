// pre: comando de voz ("serviço de encanamento pro Gabriel, 516, já fiz e
// ele já pagou"). Abre esta mesma tela preenchida; quem grava é o botão.
//
// "Já feito e pago" (12/11/2026): serviço que ficou sem orçamento e já foi
// executado e recebido. Nasce como executado, com o recebimento já com
// baixa, e fica em "a finalizar": a finalização continua sendo o passo de
// conferir gastos antes de travar o lucro e mandar para o Fullfin.
// Não grava dia na agenda: o trigger da agenda bloquearia o Diligências
// num dia que já passou, sem motivo.
function modalNovoServico(data, pre){
  const pc = pre?.campos || {}, feito = !!pc.executado;
  const forma = pc.forma || FORMAS[0];
  openModal('Novo serviço', `${pre ? vozBanner(pre) : ''}
    <p style="color:var(--text3);font-size:13px;margin:-6px 0 12px">Para serviço rápido, sem orçamento. Se tiver orçamento, aprove por lá que o serviço nasce sozinho.</p>
    <div class="field"><label>O que vai ser feito</label><input class="in" id="ns-desc" placeholder="Ex.: Troca de chuveiro" value="${esc(pc.descricao || '')}"></div>
    <div class="field"><label>Cliente</label><div style="display:flex;gap:8px"><select class="in" id="ns-cli" onchange="nsCli()">
      <option value="">— sem cadastro —</option>${S.clientes.map(c => `<option value="${c.id}" ${c.id === pc.cliente_id ? 'selected' : ''}>${esc(nomeC(c))}</option>`).join('')}</select>
      <button class="btn btn-s btn-sm" onclick="nsNovoCliente()">${ic('plus')}</button></div></div>
    <div class="field"><label>Endereço</label><input class="in" id="ns-end"></div>
    <div class="f2"><div class="field"><label>Bairro</label><input class="in" id="ns-bai"></div><div class="field"><label>Cidade</label><input class="in" id="ns-cid"></div></div>
    <div class="f2"><div class="field"><label>Valor cobrado (R$)</label><input class="in num" id="ns-val" inputmode="numeric" data-money value="${pc.valor ? moneyIn(pc.valor) : ''}"></div>
      <div class="field"><label>Material previsto (R$)</label><input class="in num" id="ns-mat" inputmode="numeric" data-money></div></div>
    <label style="display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-weight:700;cursor:pointer">
      <input type="checkbox" id="ns-feito" ${feito ? 'checked' : ''} onchange="nsFeito()" style="width:20px;height:20px"> Já feito e pago</label>
    <div id="ns-agenda" class="f3"><div class="field"><label>Data</label><input class="in" type="date" id="ns-data" value="${data || pc.data || ''}"></div>
      <div class="field"><label>Início</label><input class="in" type="time" id="ns-ini" value="${pc.hora_inicio || ''}"></div><div class="field"><label>Fim</label><input class="in" type="time" id="ns-fim" value="${pc.hora_fim || ''}"></div></div>
    <div id="ns-pago">
      <div class="field"><label>Recebido em</label><input class="in" type="date" id="ns-rec" value="${(feito && pc.data) || hoje()}"></div>
      <div class="field"><label>Forma</label><div class="chips" id="ns-forma">${FORMAS.map(f => `<button class="chip ${f === forma ? 'on' : ''}" onclick="chipUnico(this)">${f}</button>`).join('')}</div></div>
      <div class="field"><label>Caiu em</label>${segConta('ns-conta', pc.conta)}</div></div>
    <div id="ns-warn"></div>
    <button class="btn btn-p btn-w" id="ns-ok" onclick="criarServico()">Criar serviço</button>`);
  ['ns-data','ns-ini','ns-fim'].forEach(i => $(i).addEventListener('change', () => { $('ns-warn').innerHTML = warnHtml(conflitos(fv('ns-data'), fv('ns-ini'), fv('ns-fim'))); }));
  if (data) $('ns-warn').innerHTML = warnHtml(conflitos(data, '', ''));
  nsFeito();
  if (pc.cliente_id) nsCli();
  if (pre) vozMarcarVazios(['ns-desc','ns-cli','ns-val']);
}
function nsFeito(){
  const f = $('ns-feito').checked;
  $('ns-agenda').style.display = f ? 'none' : '';
  $('ns-pago').style.display = f ? '' : 'none';
  $('ns-ok').innerHTML = f ? `${ic('check')} Criar como feito e pago` : 'Criar serviço';
  if (f) $('ns-warn').innerHTML = '';
}
// Só existe um modal por vez: guarda o formulário, cadastra o cliente e
// volta com tudo preenchido.
const NS_CAMPOS = ['ns-desc','ns-end','ns-bai','ns-cid','ns-val','ns-mat','ns-data','ns-ini','ns-fim','ns-rec'];
function nsNovoCliente(){
  const rasc = {}; NS_CAMPOS.forEach(k => rasc[k] = fv(k)); const feito = $('ns-feito').checked;
  modalCliente(null, cid => { modalNovoServico(rasc['ns-data']); NS_CAMPOS.forEach(k => { if ($(k)) $(k).value = rasc[k]; });
    $('ns-feito').checked = feito; nsFeito(); $('ns-cli').value = cid; nsCli(); });
}
function nsCli(){ const c = cliente(fv('ns-cli')); if (!c) return;
  if (!fv('ns-end')) $('ns-end').value = c.endereco || ''; if (!fv('ns-bai')) $('ns-bai').value = c.bairro || ''; if (!fv('ns-cid')) $('ns-cid').value = c.cidade || ''; }
const warnHtml = av => av.map(a => `<div class="warn">${ic('alert')}<span>${a}</span></div>`).join('');
async function criarServico(){
  const desc = fv('ns-desc').trim(); if (!desc) return toast('Diga o que vai ser feito.', true);
  const feito = $('ns-feito').checked;
  const ini = feito ? '' : fv('ns-ini'), fim = feito ? '' : fv('ns-fim'), data = feito ? '' : fv('ns-data');
  if (ini && fim && fim <= ini) return toast('O fim precisa ser depois do início.', true);
  const val = parseMoney(fv('ns-val'));
  // Feito e pago sem valor deixaria o serviço sem nada recebido e o lucro
  // sairia negativo na finalização.
  const rec = feito ? fv('ns-rec') : '';
  if (feito && !(val > 0)) return toast('Diga quanto o cliente pagou.', true);
  if (feito && !rec) return toast('Escolha a data em que recebeu.', true);
  const conta = feito ? segVal('ns-conta') : null;
  let rid = null;
  const sid = await act(async () => {
    const [s] = await db.ins('tdh_servicos', { descricao:desc, cliente_id:fv('ns-cli') || null, endereco:fv('ns-end').trim() || null,
      bairro:fv('ns-bai').trim() || null, cidade:fv('ns-cid').trim() || null, valor_cobrado:val, custo_material:parseMoney(fv('ns-mat')),
      status: feito ? 'executado' : data ? 'agendado' : 'a_agendar' });
    S.servicos.unshift(s);
    if (val > 0) {
      const base = { servico_id:s.id, descricao:'Pagamento', valor:val, previsao:(feito ? rec : data) || null };
      const [r] = await db.ins('tdh_recebimentos', feito ? { ...base, recebido_em:rec, forma_pagamento:chipSel('ns-forma'), ...contaPatch(conta) } : base);
      S.receb.push(r); rid = r.id;
    }
    // O trigger do banco cria o bloqueio no Diligências ao gravar o dia.
    if (data) S.agendas.push(...await db.ins('tdh_agendas', { servico_id:s.id, data, horario_inicio:ini || null, horario_fim:fim || null }));
    return s.id;
  }, feito ? 'Serviço criado como feito e pago.' : 'Serviço criado.');
  if (!sid) return;
  // Caiu na PF: mesmo caminho do "Recebi" — já pergunta o acerto.
  // pushState em vez de go(): a troca de hash fecha o modal aberto
  // (listener do hashchange), e o acerto sumiria logo que aparece.
  if (feito && cartTipo(conta) === 'pf' && rid) { closeModal(); history.pushState(null, '', '#/serv/' + sid); render(); return modalAcerto('receb', rid); }
  closeModal(); go('#/serv/' + sid);
}

async function setStatusServ(sid, st){
  const s = serv(sid); if (s.status === st) return;

  const a = aid ? S.agendas.find(x => x.id === aid) : null, pc = pre?.campos || {}, sv = pre ? serv(sid) : null;
  openModal(a ? 'Editar dia' : 'Marcar dia', `${pre ? vozBanner(pre) : ''}

async function salvarAgenda(sid, aid){
  const data = fv('ag-data'), ini = fv('ag-ini') || null, fim = fv('ag-fim') || null;
  if (!data) return toast('Escolha a data.', true);
  if (fim && !ini) return toast('Coloque o horário de início.', true);
  if (ini && fim && fim <= ini) return toast('O fim precisa ser depois do início.', true);
  const s = serv(sid);
  const ok = await act(async () => {
    const row = { data, horario_inicio:ini, horario_fim:fim };
    if (aid) { const [n] = await db.upd('tdh_agendas', eqId(aid), row); Object.assign(S.agendas.find(x => x.id === aid), n); }
    else S.agendas.push(...await db.ins('tdh_agendas', { ...row, servico_id:sid }));
    // Primeiro dia marcado: o serviço passa de "a agendar" para "agendado".
    if (s.status === 'a_agendar') { const [n] = await db.upd('tdh_servicos', eqId(sid), { status:'agendado' }); Object.assign(s, n); }
    gcalSync(sid);
    await loadDiligencias();
    return true;
  }, 'Dia salvo e bloqueado no Diligências.');
  if (ok) { closeModal(); rerender(); }
}
function excluirAgenda(aid){

    const ok = await act(async () => { await db.del('tdh_agendas', eqId(aid)); S.agendas = S.agendas.filter(a => a.id !== aid); await loadDiligencias(); return true; });
    if (ok) rerender();
  }, true);
}

/* ═══════════════════════════════════════════════════════════════════
   FINANCEIRO — gastos reais, conta PJ/PF, acerto e transferências
   ═══════════════════════════════════════════════════════════════════
   Regras (estrutura em previmater-ops/_sql/tdh_03_financeiro.sql):
   * Gasto com obra = custo da obra. Gasto sem obra = custo fixo do mês.
     Tudo numa tabela só, para não ter duas telas e duas regras.
   * Todo dinheiro diz onde caiu ou de onde saiu (PJ ou PF). A conta
     deveria ser só PJ, mas às vezes não é; sem isso o saldo não fecha.
   * Dinheiro que passou pela PF é acertado caso a caso, à mão (decisão
     do Esdras). Enquanto não acerta, fica em "Acertar com a PF".
   * Quem cria e apaga a transferência de um acerto é o banco (trigger),
     então o app só grava o acerto e recarrega S.transf. */
const CAT_GASTO = { material:'Material', combustivel:'Combustível', alimentacao:'Alimentação', ferramenta:'Ferramenta',
  anuncio:'Anúncio', imposto:'Imposto', taxa:'Taxa', outro:'Outro' };
const ACERTO_TXT = { retirada:'ficou comigo', devolvido:'devolvi à PJ', reembolsado:'PJ me reembolsou', aporte:'aporte meu' };

// Conta de onde saiu / onde caiu. v pode ser o id da carteira (lançamento
// novo) ou 'pj'/'pf' (lançamento antigo e comando de voz): nesse caso abre
// na primeira conta daquele tipo. Sem contas carregadas, volta o PJ/PF.
const cartTipo = v => v === 'pj' || v === 'pf' ? v : (S.carteiras.find(c => c.id === v)?.tdh_uso || 'pj');
const cartNome = id => S.carteiras.find(c => c.id === id)?.nome || '';
const cartIni = v => S.carteiras.find(c => c.id === v)?.id || S.carteiras.find(c => c.tdh_uso === (v || 'pj'))?.id || '';
function segConta(id, v){
  if (!S.carteiras.length) return `<div class="seg" id="${id}">${[['pj','Conta PJ'],['pf','Minha conta (PF)']]
    .map(([k,t]) => `<button type="button" data-v="${k}" class="${(v || 'pj') === k ? 'on' : ''}" onclick="segPick(this)">${t}</button>`).join('')}</div>`;
  const sel = cartIni(v);
  const grupo = (k, t) => `<optgroup label="${t}">${S.carteiras.filter(c => c.tdh_uso === k)
    .map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.nome)}</option>`).join('')}</optgroup>`;
  return `<select class="in" id="${id}">${grupo('pj', 'Conta da empresa (PJ)')}${grupo('pf', 'Minha conta (PF)')}</select>`;
}
function segPick(el){ el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); }
// Previsto/Imprevisto. Padrão é Previsto: gasto sem marca conta como
// previsto, que é a regra combinada (só é imprevisto quando ele diz).
const segImprev = (id, v) => `<div class="seg" id="${id}">${[['0','Previsto'],['1','Imprevisto']]
  .map(([k,t]) => `<button type="button" data-v="${k}" class="${(v ? '1' : '0') === k ? 'on' : ''}" onclick="segPick(this)">${t}</button>`).join('')}</div>`;
const segVal = id => { const el = $(id); return el?.tagName === 'SELECT' ? (el.value || 'pj') : (el?.querySelector('button.on')?.dataset.v || 'pj'); };
// Voltar para PJ apaga o acerto: o banco não aceita acerto em dinheiro
// da PJ, e a transferência que ele tinha gerado some junto (trigger).
// 'pj'/'pf' literal (repasse que voltou a pendente, gasto pago todo com
// crédito) limpa a conta: o dinheiro não andou.
const contaPatch = c => { const k = cartTipo(c), cid = c === 'pj' || c === 'pf' ? null : c;
  return k === 'pj' ? { conta:'pj', carteira_id:cid, acerto:null, acerto_em:null } : { conta:'pf', carteira_id:cid }; };

// O que ainda precisa de acerto. Recebimento só depois de recebido, e
// repasse só depois de pago: antes disso o dinheiro não andou.
const pendPF = {
  receb:   () => S.receb.filter(r => r.conta === 'pf' && r.recebido_em && !r.acerto && servExiste(r.servico_id)),
  // Gasto pago todo com crédito de loja não saiu do bolso: nada a acertar.
  gasto:   () => S.gastos.filter(g => g.conta === 'pf' && !g.acerto && pago(g) > 0),
  repasse: () => S.vinc.filter(v => v.conta === 'pf' && v.repasse_status === 'pago' && !v.acerto),
};
const servExiste = sid => !!serv(sid);
const totPendPF = () => pendPF.receb().length + pendPF.gasto().length + pendPF.repasse().length;
function pfInfo(kind, x){
  if (x.conta !== 'pf') return '';
  if (x.acerto) return ` · <span class="badge b-gray">PF · ${ACERTO_TXT[x.acerto]}</span>`;
  return ` · <button class="badge b-yel" style="border:0;cursor:pointer" onclick="event.stopPropagation();modalAcerto('${kind}','${x.id}')">PF · acertar</button>`;
}

// ── Créditos em loja ───────────────────────────────────────────────
// Devolução que virou crédito (tdh_creditos_loja) e gasto pago em parte
// com crédito (credito_valor). O gasto conta CHEIO na obra; no caixa, no
// saldo da PJ e no acerto PF conta só o que saiu de fato.
const pago = g => num(g.valor) - num(g.credito_valor);
// Mesma normalização do banco (tdh_loja_chave): "Balaróti " = "balaroti".
const lojaChave = t => String(t || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
function saldosLoja(){
  const m = {};
  const pega = (nome) => { const k = lojaChave(nome); if (!m[k]) m[k] = { chave:k, nome:String(nome).trim(), devol:0, uso:0 }; return m[k]; };
  S.creditos.forEach(c => { const x = pega(c.loja); x.devol += num(c.valor); x.nome = String(c.loja).trim(); });
  S.gastos.filter(g => num(g.credito_valor) > 0).forEach(g => { pega(g.credito_loja).uso += num(g.credito_valor); });
  return Object.values(m).map(x => ({ ...x, saldo: Math.round((x.devol - x.uso) * 100) / 100 })).sort((a,b) => b.saldo - a.saldo || a.nome.localeCompare(b.nome));
}
const saldoLoja = nome => saldosLoja().find(x => x.chave === lojaChave(nome))?.saldo || 0;

function rowCredito(c){
  const s = c.servico_id ? serv(c.servico_id) : null;
  return `<div class="row" onclick="modalCredito({ cid:'${c.id}' })"><div class="main">
    <div class="t">Devolução · ${esc(c.loja)}${c.descricao ? ' · ' + esc(c.descricao) : ''}</div>
    <div class="m">${fmtData(c.data)}${s && route().page !== 'serv' ? ' · ' + esc(s.descricao) : ''}${!s ? ' · sem obra' : ''}</div></div>
    <div class="r val" style="color:var(--green)">+ ${m$(c.valor)}</div></div>`;
}
function vCreditos(){
  const ls = saldosLoja();
  const usos = S.gastos.filter(g => num(g.credito_valor) > 0);
  const hist = [...S.creditos.map(c => ({ d:c.data, h:rowCredito(c) })),
    ...usos.map(g => ({ d:g.data, h:`<div class="row" onclick="modalGasto({ gid:'${g.id}' })"><div class="main">
      <div class="t">Usado · ${esc(g.credito_loja)}${g.descricao ? ' · ' + esc(g.descricao) : ''}</div>
      <div class="m">${fmtData(g.data)}${g.servico_id ? ' · ' + esc(serv(g.servico_id)?.descricao || '') : ''} · gasto de ${money(g.valor)}</div></div>
      <div class="r val" style="color:var(--red)">− ${m$(g.credito_valor)}</div></div>` }))].sort((a,b) => b.d.localeCompare(a.d));
  return `<a class="back" href="#/mais">${ic('left')} Mais</a>
  <div class="pg-head"><h2 class="pg">Créditos em loja</h2></div>
  <p style="color:var(--text3);font-size:13.5px;margin:-6px 0 14px">Material devolvido que virou crédito. A devolução baixa o gasto da obra de onde saiu; quando o crédito é usado, o gasto da obra nova conta cheio, mas no caixa só entra o que você pagou.</p>
  <div class="list">${ls.length ? ls.map(x => `<div class="row"><div class="main"><div class="t">${esc(x.nome)}</div>
      <div class="m">devolvido ${money(x.devol)} · usado ${money(x.uso)}</div></div>
      <div class="r val" style="${x.saldo > 0 ? 'color:var(--green);font-weight:800' : 'color:var(--text3)'}">${m$(x.saldo)}</div></div>`).join('')
    : '<div class="empty">Nenhum crédito ainda. Quando devolver material e a loja der crédito, lance aqui ou na obra.</div>'}</div>
  <div class="sec">Movimentos</div>
  <div class="list">${hist.length ? hist.map(x => x.h).join('') : '<div class="empty">Nada lançado.</div>'}</div>
  <div style="height:64px"></div>
  <button class="fab" onclick="modalCredito({})">${ic('plus')} Devolução</button>`;
}
// op: { sid } já ligado à obra de origem; { cid } edita; { voz } vem do comando de voz.
function modalCredito(op = {}){
  const c = op.cid ? S.creditos.find(x => x.id === op.cid) : null;
  const pre = !c && op.voz ? op.voz : null, pc = pre?.campos || {};
  const sid = c ? c.servico_id : (op.sid || pc.servico_id || null);
  // Obra finalizada fica de fora: a devolução muda o lucro dela, e o banco
  // recusa (reabra a obra antes).
  const obras = S.servicos.filter(s => s.id === sid || (!s.finalizado_em && s.status !== 'cancelado'));
  const lojas = [...new Set([...S.creditos.map(x => String(x.loja).trim()), ...S.gastos.map(g => String(g.credito_loja || '').trim()).filter(Boolean)])];
  openModal(c ? 'Editar devolução' : 'Devolução com crédito', `${pre ? vozBanner(pre) : ''}
    <div class="field"><label>Loja</label><input class="in" id="cr-loja" list="cr-lojas" value="${esc(c?.loja || pc.loja || '')}" placeholder="Ex.: Balaroti">
      <datalist id="cr-lojas">${lojas.map(l => `<option value="${esc(l)}">`).join('')}</datalist></div>
    <div class="f2"><div class="field"><label>Crédito (R$)</label><input class="in num" id="cr-val" inputmode="numeric" data-money value="${moneyIn(c?.valor || pc.valor)}"></div>
      <div class="field"><label>Data</label><input class="in" type="date" id="cr-data" value="${c?.data || pc.data || hoje()}"></div></div>
    <div class="field"><label>Obra de onde saiu o material</label><select class="in" id="cr-obra">
      ${pre && !sid ? '<option value="__" selected>— escolha a obra —</option>' : ''}<option value="">— sem obra —</option>${obras.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.descricao)}${cliente(s.cliente_id) ? ' · ' + esc(nomeC(cliente(s.cliente_id))) : ''}</option>`).join('')}
    </select><div class="hint">O valor sai do gasto dessa obra (o material voltou). Obra finalizada precisa ser reaberta.</div></div>
    <div class="field"><label>O que foi devolvido</label><input class="in" id="cr-desc" value="${esc(c?.descricao || pc.descricao || '')}" placeholder="Ex.: 3 telhas, sobra de cimento"></div>
    <div class="btns"><button class="btn btn-p" style="flex:1" onclick="salvarCredito(${c ? `'${c.id}'` : 'null'})">Salvar</button>
      ${c ? `<button class="btn btn-d" onclick="excluirCredito('${c.id}')">${ic('trash')}</button>` : ''}</div>`);
  if (pre) vozMarcarVazios(['cr-loja', 'cr-val', 'cr-obra']);
}
async function salvarCredito(cid){
  const loja = fv('cr-loja').trim(); if (!loja) return toast('Coloque a loja.', true);
  const v = parseMoney(fv('cr-val')); if (!v) return toast('Coloque o valor do crédito.', true);
  if (fv('cr-obra') === '__') return toast('Escolha a obra (ou "sem obra").', true);
  // Mesmo nome de loja já usado: evita "Balaroti" e "Balarotti" virarem
  // dois saldos sem ninguém perceber.
  const igual = saldosLoja().find(x => x.chave === lojaChave(loja));
  const row = { loja: igual ? igual.nome : loja, valor:v, data:fv('cr-data') || hoje(), servico_id: fv('cr-obra') || null, descricao: fv('cr-desc').trim() || null };
  const ok = await act(async () => {
    if (cid) { const [n] = await db.upd('tdh_creditos_loja', eqId(cid), row); Object.assign(S.creditos.find(x => x.id === cid), n); }
    else { const [n] = await db.ins('tdh_creditos_loja', row); S.creditos.push(n); }
    return true; }, 'Crédito lançado.');
  if (ok) { closeModal(); rerender(); }
}
function excluirCredito(cid){ closeModal();
  confirmar('Excluir devolução', 'Apagar esta devolução? O gasto da obra volta a contar o material, e o crédito some da loja (se já foi usado, o banco não deixa).', 'Excluir', async () => {
    const ok = await act(async () => { await db.del('tdh_creditos_loja', eqId(cid)); S.creditos = S.creditos.filter(c => c.id !== cid); return true; });
    if (ok) rerender(); }, true); }

// ── Gastos ─────────────────────────────────────────────────────────
function rowGasto(g){
  const s = g.servico_id ? serv(g.servico_id) : null;
  return `<div class="row" onclick="modalGasto({ gid:'${g.id}' })"><div class="main">
    <div class="t">${CAT_GASTO[g.categoria] || g.categoria}${g.descricao ? ' · ' + esc(g.descricao) : ''}${g.imprevisto ? ' <span class="badge b-red">Imprevisto</span>' : ''}</div>
    <div class="m">${fmtData(g.data)}${s && route().page !== 'serv' ? ' · ' + esc(s.descricao) : ''}${num(g.credito_valor) > 0 ? ` · <span class="badge b-gray">crédito ${esc(g.credito_loja)} ${money(g.credito_valor)}</span>` : ''}${pfInfo('gasto', g)}</div></div>
    <div class="r val">${m$(g.valor)}</div></div>`;
}
// op: { sid } abre já ligado à obra; { fixo:true } abre como custo fixo;
// {} (atalho do Painel) pergunta a obra; { gid } edita.
// { voz } vem do comando de voz: abre como gasto novo, já preenchido, com a
// faixa do que foi ouvido. A obra entra na lista mesmo que o filtro abaixo
// a deixasse de fora, porque a function já conferiu que ela aceita gasto.
function modalGasto(op = {}){
  const g = op.gid ? S.gastos.find(x => x.id === op.gid) : null;
  const pre = !g && op.voz ? op.voz : null;
  const sid = g ? g.servico_id : (op.sid || pre?.campos?.servico_id || null);
  // Serviço finalizado fica de fora: o banco recusa gasto novo nele.
  const obras = S.servicos.filter(s => s.id === sid || !s.finalizado_em).filter(s => s.status === 'a_agendar' || s.status === 'agendado' || s.id === sid
    || (s.status === 'executado' && agendasDe(s.id).some(a => a.data >= addDias(hoje(), -30))));
  const escolheObra = !op.sid || g;
  const pc = pre?.campos || {};
  openModal(g ? 'Editar gasto' : (op.fixo ? 'Custo fixo' : 'Novo gasto'), `${pre ? vozBanner(pre) : ''}
    <div class="f2"><div class="field"><label>Valor (R$)</label><input class="in num" id="gs-val" inputmode="numeric" data-money value="${g ? moneyIn(g.valor) : moneyIn(pc.valor)}"></div>
      <div class="field"><label>Data</label><input class="in" type="date" id="gs-data" value="${g?.data || pc.data || hoje()}"></div></div>
    <div class="field"><label>Categoria</label><div class="chips" id="gs-cat">${Object.entries(CAT_GASTO).map(([k,t]) =>
      `<button class="chip ${(g?.categoria || pc.categoria || (op.fixo ? '' : 'material')) === k ? 'on' : ''}" data-v="${k}" onclick="chipUnico(this)">${t}</button>`).join('')}</div></div>
    <div class="field"><label>Descrição</label><input class="in" id="gs-desc" value="${esc(g?.descricao || pc.descricao || '')}" placeholder="Ex.: nota da Leroy, disjuntores"></div>
    ${escolheObra ? `<div class="field"><label>Obra</label><select class="in" id="gs-obra">
      ${pre && !sid && !pc.sem_obra ? '<option value="__" selected>— escolha a obra —</option>' : ''}<option value="">— custo fixo (sem obra) —</option>${obras.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.descricao)}${cliente(s.cliente_id) ? ' · ' + esc(nomeC(cliente(s.cliente_id))) : ''}</option>`).join('')}
      </select>${op.fixo ? '' : '<div class="hint">Sem obra conta como custo fixo do mês (anúncio, DAS, ferramenta).</div>'}</div>` : ''}
    ${op.fixo ? '' : `<div class="field"><label>Estava previsto no orçamento?</label>${segImprev('gs-imprev', g ? g.imprevisto : pc.imprevisto)}
      <div class="hint">Imprevisto = compra fora do escopo orçado (ex.: lona que não estava no serviço). Não muda o lucro, só mostra quanto saiu com imprevisto.</div></div>`}
    ${gastoCreditoHtml(g, pc)}
    <div class="field"><label>Saiu de</label>${segConta('gs-conta', g?.carteira_id || g?.conta || pc.conta)}</div>
    ${g?.acerto ? `<div class="hint" style="margin:-6px 0 12px">Acerto: ${ACERTO_TXT[g.acerto]} em ${fmtData(g.acerto_em)}. <button class="lnk" style="border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:0" onclick="modalAcerto('gasto','${g.id}')">Mudar</button></div>` : ''}
    <div class="btns"><button class="btn btn-p" style="flex:1" onclick="salvarGasto(${g ? `'${g.id}'` : 'null'}, ${!escolheObra ? `'${sid}'` : 'null'})">Salvar</button>
      ${g ? `<button class="btn btn-d" onclick="excluirGasto('${g.id}')">${ic('trash')}</button>` : ''}</div>`);
  if (pre) {
    // Sem foco no valor: o teclado subiria por cima do que é para conferir.
    // Obra em branco só é marcada se não foi dito "sem obra" (custo fixo).
    // Falou de crédito mas a loja não foi achada: a lista de lojas fica em
    // amarelo para escolher.
    vozMarcarVazios(['gs-val', ...(pc.sem_obra ? [] : ['gs-obra']), ...(num(pc.credito_valor) > 0 && !pc.credito_loja ? ['gs-cred-loja'] : [])]);
    return;
  }
  setTimeout(() => $('gs-val')?.focus(), 50);
}
// Bloco "usou crédito de loja?" do gasto. Só aparece se existe crédito com
// saldo (ou se este gasto já usa crédito / a voz falou de crédito).
function gastoCreditoHtml(g, pc){
  const ls = saldosLoja().filter(x => x.saldo > 0.004);
  const atual = g && num(g.credito_valor) > 0 ? lojaChave(g.credito_loja) : (pc.credito_loja ? lojaChave(pc.credito_loja) : '');
  if (!ls.length && !atual) return '';
  // Editando: o crédito que ESTE gasto já usa volta para o saldo disponível.
  const disp = x => x.saldo + (g && lojaChave(g.credito_loja) === x.chave ? num(g.credito_valor) : 0);
  const opts = [...ls]; if (atual && !opts.some(x => x.chave === atual)) { const t = saldosLoja().find(x => x.chave === atual); if (t) opts.push(t); }
  const val = g ? num(g.credito_valor) : num(pc.credito_valor);
  return `<div class="field"><label>Usou crédito de loja?</label><select class="in" id="gs-cred-loja" onchange="$('gs-cred-box').style.display=this.value?'':'none'">
      <option value="">Não</option>${opts.map(x => `<option value="${esc(x.nome)}" ${x.chave === atual ? 'selected' : ''}>${esc(x.nome)} · saldo ${money(disp(x))}</option>`).join('')}</select>
    <div id="gs-cred-box" style="${atual || (!g && num(pc.credito_valor) > 0) ? '' : 'display:none'};margin-top:8px"><input class="in num" id="gs-cred-val" inputmode="numeric" data-money value="${moneyIn(val)}" placeholder="Quanto do crédito usou">
      <div class="hint">O gasto conta cheio na obra; no caixa entra só o que você pagou (valor − crédito).</div></div></div>`;
}
async function salvarGasto(gid, sidPreso){
  const v = parseMoney(fv('gs-val')); if (!v) return toast('Coloque o valor.', true);
  // Crédito de loja: confere aqui para dar mensagem clara (o banco também
  // barra saldo negativo).
  const credLoja = $('gs-cred-loja') ? fv('gs-cred-loja') : '';
  const credVal = credLoja ? parseMoney(fv('gs-cred-val')) : 0;
  if (credLoja && !credVal) return toast('Coloque quanto do crédito usou (ou marque "Não").', true);
  if (credVal > v + 0.004) return toast('O crédito usado não pode passar do valor do gasto.', true);
  if (credLoja) {
    const g0 = gid ? S.gastos.find(x => x.id === gid) : null;
    const disp = saldoLoja(credLoja) + (g0 && lojaChave(g0.credito_loja) === lojaChave(credLoja) ? num(g0.credito_valor) : 0);
    if (credVal > disp + 0.004) return toast(`Crédito insuficiente: ${credLoja} tem ${money(disp)}.`, true);
  }
  const cat = $('gs-cat').querySelector('.chip.on')?.dataset.v; if (!cat) return toast('Escolha a categoria.', true);
  const data = fv('gs-data'); if (!data) return toast('Escolha a data.', true);
  // "__" só existe no gasto aberto pela voz sem obra definida: sem esta
  // trava, salvar sem olhar mandaria o gasto da obra para custo fixo.
  if (fv('gs-obra') === '__') return toast('Escolha a obra (ou "custo fixo").', true);
  const row = { valor:v, data, categoria:cat, descricao:fv('gs-desc').trim() || null,
    servico_id: sidPreso || ($('gs-obra') ? fv('gs-obra') || null : null), ...contaPatch(segVal('gs-conta')) };
  // Custo fixo (sem obra) não tem orçamento para fugir: nunca é imprevisto.
  row.imprevisto = !!row.servico_id && $('gs-imprev')?.querySelector('button.on')?.dataset.v === '1';
  row.credito_loja = credLoja ? (saldosLoja().find(x => x.chave === lojaChave(credLoja))?.nome || credLoja) : null;
  row.credito_valor = credLoja ? credVal : 0;
  // Pago todo com crédito: não saiu de conta nenhuma, então não há acerto PF.
  if (row.credito_valor >= v - 0.004) Object.assign(row, contaPatch('pj'));
  let novo = null;
  const ok = await act(async () => {
    if (gid) { const [n] = await db.upd('tdh_gastos', eqId(gid), row); Object.assign(S.gastos.find(x => x.id === gid), n); }
    else { [novo] = await db.ins('tdh_gastos', row); S.gastos.push(novo); }
    await load('transf'); return true; }, 'Gasto lançado.');
  if (!ok) return;
  if (novo?.conta === 'pf' && pago(novo) > 0) modalAcerto('gasto', novo.id); else { closeModal(); rerender(); }
}
function excluirGasto(gid){ closeModal();
  confirmar('Excluir gasto', 'Apagar este gasto?', 'Excluir', async () => {
    const ok = await act(async () => { await db.del('tdh_gastos', eqId(gid)); S.gastos = S.gastos.filter(g => g.id !== gid); await load('transf'); return true; });
    if (ok) rerender(); }, true); }

// ── Comando de voz ─────────────────────────────────────────────────
// Toque no microfone verde, fale ("gastei 89,50 no Balaroti na obra da
// Setup"), toque no botão grande. O áudio vai para a function tdh-voz
// (previmater-ops), que transcreve e devolve os campos.
//
// A voz NUNCA grava no banco. Ela só abre o "Novo gasto" de sempre já
// preenchido, e quem salva é o Salvar de sempre. Motivo: um só caminho de
// gravação (acerto PF, trava de obra finalizada continuam iguais) e todo
// erro de interpretação é visto antes de virar dado. Campo que a IA não
// teve certeza vem vazio e marcado em amarelo.
//
// Para a próxima versão (orçamento, recebimento, repasse): cada ação nova
// da function ganha um "if (j.acao === ...)" em vozAplicar, abrindo o
// formulário que já existe para ela.
const VOZ_URL = SB_URL + '/functions/v1/tdh-voz';
// Teto de gravação: comando é curto. Passou disso, é gravação esquecida
// ligada — para sozinho e envia o que tem.
const VOZ_MAX_SEG = 45;
const _voz = { rec:null, stream:null, partes:[], timer:null, t0:0, cancelado:false, ocupado:false };

const VOZ_ICONE_ENVIAR = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>';
const VOZ_ICONE_MIC = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';

// O botão grande faz duas coisas: grava (quando a tela está "pronta",
// esperando um toque) ou envia (quando já está gravando).
function vozBotaoGrande(){
  if (_voz.rec && _voz.rec.state === 'recording') vozParar(false); else vozToggle();
}
// Tela de gravação aberta, mas ainda sem gravar. Usada pelo atalho quando o
// navegador não libera o microfone sem um toque na tela: aí o toque é no
// próprio botão grande.
function vozMostrarPronto(){
  $('voz-overlay').classList.add('aberto');
  $('voz-tempo').textContent = '';
  $('voz-dica').firstChild.textContent = 'Toque no botão e fale';
  const b = $('voz-parar'); b.innerHTML = VOZ_ICONE_MIC; b.setAttribute('aria-label', 'Começar a gravar');
}
// ATALHO (manifest.json → shortcuts, url ?voz=1). Segurar o ícone do app
// mostra "Lançar por voz"; arrastado para a tela inicial vira ícone próprio.
// ?voz_texto=... vem do CONCIERGE (app porteiro): ele já ouviu e
// transcreveu, e decidiu que a fala é do Trabalho de Homem. Aqui o texto vai
// para a tdh-voz como se tivesse sido falado neste app, e abre a mesma tela
// de confirmação. Não grava nada sozinho.
async function vozAtalho(){
  const q = new URLSearchParams(location.search);
  const vt = (q.get('voz_texto') || '').trim();
  if (q.get('voz') !== '1' && !vt) return;
  // Tira os parâmetros da barra: senão recarregar a página repetiria o
  // comando sem a pessoa pedir.
  q.delete('voz'); q.delete('voz_texto');
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
  if (vt) return vozDeTexto(vt.slice(0, 500));
  vozMostrarPronto();
  await vozToggle(true);
}
async function vozDeTexto(texto){
  if (_voz.ocupado) return;
  _voz.ocupado = true; loading(true);
  try {
    if (sess?.expires_at && sess.expires_at - 60 < Date.now()/1000) await refreshSess();
    if (!sess?.access_token) throw new Error('Entre de novo no app.');
    const fd = new FormData();
    fd.append('texto', texto); fd.append('hoje', hoje());
    vozAnexarContexto(fd);
    const r = await fetch(VOZ_URL, { method:'POST', headers:{ Authorization:'Bearer ' + sess.access_token, apikey:SB_KEY }, body:fd });
    const j = await r.json().catch(() => ({ ok:false, erro:'resposta inválida (' + r.status + ')' }));
    loading(false);
    if (!j.ok) return vozNaoEntendi(j.transcricao || texto, [j.erro || 'Falhou.']);
    vozAplicar(j);
  } catch(e) { loading(false); toast(e?.message || 'Sem conexão.', true); }
  finally { _voz.ocupado = false; loading(false); }
}

async function vozToggle(automatico){
  if (_voz.ocupado) return;
  if (_voz.rec && _voz.rec.state === 'recording') { vozParar(false); return; }
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') {
    $('voz-overlay').classList.remove('aberto'); return toast('Este aparelho não permite gravar áudio aqui.', true); }
  try { _voz.stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e) {
    // Vindo do atalho, a falha costuma ser só "precisa de um toque": a
    // tela fica no modo pronto esperando o toque no botão grande.
    if (automatico === true) return;
    $('voz-overlay').classList.remove('aberto');
    return toast('Libere o microfone para o app nas configurações do navegador.', true);
  }
  // iPhone grava em mp4; Android/desktop em webm. A function aceita os dois.
  const tipos = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
  const mime = tipos.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch(e) { return false; } }) || '';
  try { _voz.rec = mime ? new MediaRecorder(_voz.stream, { mimeType:mime }) : new MediaRecorder(_voz.stream); }
  catch(e) { vozSoltarMic(); return toast('Não consegui iniciar a gravação.', true); }
  _voz.partes = []; _voz.cancelado = false; _voz.t0 = Date.now();
  _voz.rec.ondataavailable = e => { if (e.data?.size) _voz.partes.push(e.data); };
  _voz.rec.onstop = () => { vozSoltarMic(); if (!_voz.cancelado) vozEnviar(); };
  _voz.rec.start();
  $('voz-overlay').classList.add('aberto');
  const bG = $('voz-parar'); bG.innerHTML = VOZ_ICONE_ENVIAR; bG.setAttribute('aria-label', 'Parar e enviar');
  $('voz-dica').firstChild.textContent = 'Fale e toque no botão para enviar';
  const tick = () => {
    const seg = Math.floor((Date.now() - _voz.t0) / 1000);
    $('voz-tempo').textContent = Math.floor(seg/60) + ':' + String(seg % 60).padStart(2, '0');
    if (seg >= VOZ_MAX_SEG) vozParar(false);
  };
  tick(); _voz.timer = setInterval(tick, 500);
}

function vozParar(cancelar){
  _voz.cancelado = !!cancelar;
  clearInterval(_voz.timer);
  $('voz-overlay').classList.remove('aberto');
  try { if (_voz.rec?.state === 'recording') _voz.rec.stop(); else vozSoltarMic(); } catch(e) { vozSoltarMic(); }
}

// Desliga o microfone de verdade: sem isso o iPhone deixa o ícone de
// gravação aceso até fechar o app.
function vozSoltarMic(){ try { _voz.stream?.getTracks().forEach(t => t.stop()); } catch(e){} _voz.stream = null; }

async function vozEnviar(){
  const tipo = _voz.rec?.mimeType || 'audio/webm';
  const blob = new Blob(_voz.partes, { type:tipo });
  if (blob.size < 1500) return toast('Não deu para ouvir. Toque e fale de novo.', true);
  _voz.ocupado = true; loading(true);
  try {
    // Mesma renovação de sessão do resto do app: token vencido renova antes.
    if (sess?.expires_at && sess.expires_at - 60 < Date.now()/1000) await refreshSess();
    if (!sess?.access_token) throw new Error('Entre de novo no app.');
    const fd = new FormData();
    fd.append('audio', blob, 'comando.' + (tipo.includes('mp4') ? 'mp4' : tipo.includes('ogg') ? 'ogg' : 'webm'));
    fd.append('hoje', hoje());   // data LOCAL: a function roda em UTC
    vozAnexarContexto(fd);
    const r = await fetch(VOZ_URL, { method:'POST', headers:{ Authorization:'Bearer ' + sess.access_token, apikey:SB_KEY }, body:fd });
    const j = await r.json().catch(() => ({ ok:false, erro:'resposta inválida (' + r.status + ')' }));
    loading(false);
    if (!j.ok) return vozNaoEntendi(j.transcricao, [j.erro || 'Falhou.']);
    vozAplicar(j);
  } catch(e) {
    loading(false); toast(e?.message || 'Sem conexão.', true);
  } finally { _voz.ocupado = false; loading(false); }
}

// Cada ação abre a tela que já existe para ela. O id devolvido pela
// function tem que existir no que o app carregou: se não existir (criado
// em outro aparelho depois que o app abriu), recarrega antes de abrir.
async function vozAplicar(j){
  const c = j.campos || {};
  if (j.acao === 'consulta') return assistResposta(j);
  // Ordem dada dentro da conversa: não entendida fica na própria conversa;
  // entendida abre a tela de confirmação de sempre, e a conversa guarda o
  // registro (reabrindo o balão, ela continua de onde parou).
  if (_assist.aberto) {
    if (j.acao === 'nao_entendi') return assistResposta({ ...j, resposta:'Não consegui entender a ordem.' + ((j.duvidas || []).length ? '\n• ' + j.duvidas.join('\n• ') : ''), itens:[] });
    _assist.fio.push({ p:j.transcricao, r:'Abri a tela para você confirmar.', itens:[] });
  }
  if (j.acao === 'novo_gasto') return modalGasto({ voz:j });
  if (j.acao === 'devolucao_credito') return modalCredito({ voz:j });
  if (j.acao === 'novo_servico') return modalNovoServico(null, j);
  // Contato novo: mesmos padrões do botão "Novo contato" dos Retornos
  // (conversando, retorno em 2 dias), a não ser que a data tenha sido dita.
  // O aviso de número repetido da tela roda igual.
  if (j.acao === 'novo_contato') return modalCliente(null, null, { status:'conversando', nome:c.nome, whatsapp:c.whatsapp,
    observacoes:c.observacoes, bairro:c.bairro, cidade:c.cidade, origem:c.origem,
    proximo_contato:c.proximo_contato || addDias(hoje(), 2), _voz:j });
  const precisa = { orcamento_aprovado:['orcs', () => orc(c.orcamento_id)],
    recebimento:['receb', () => c.receb_id ? S.receb.find(r => r.id === c.receb_id) : serv(c.servico_id)],
    repasse_pago:['vinc', () => S.vinc.find(v => v.id === c.repasse_id)],
    marcar_dia:['servicos', () => serv(c.servico_id)] }[j.acao];
  if (!precisa) return vozNaoEntendi(j.transcricao, j.duvidas);
  if (!precisa[1]()) { await act(() => load('orcs', 'servicos', 'receb', 'vinc')); }
  if (!precisa[1]()) return vozNaoEntendi(j.transcricao, ['Achei, mas o app ainda não tem esse item. Puxe a tela para atualizar e fale de novo.']);
  if (j.acao === 'orcamento_aprovado') return aprovarOrc(c.orcamento_id, j);
  if (j.acao === 'repasse_pago') return pagarRepasse(c.repasse_id, j);
  if (j.acao === 'marcar_dia') return modalAgenda(c.servico_id, null, j);
  // Recebimento: valor igual ao previsto (ou não dito) → "Recebi" daquele
  // lançamento. Valor diferente → edita o lançamento com o valor falado.
  // Sem lançamento previsto → recebimento novo na obra.
  if (c.receb_id) {
    const x = S.receb.find(r => r.id === c.receb_id);
    return (!c.valor || Math.abs(num(x.valor) - c.valor) < 0.005) ? modalBaixa(x.id, j) : modalReceb(x.servico_id, x.id, j);
  }
  return modalReceb(c.servico_id, null, j);
}

// ── Assistente (perguntas) ─────────────────────────────────────────
// "O que está atrasado?", "e a Setup, falta o quê?", "o que tenho amanhã?".
//
// Quem monta os fatos é ESTE código, com as mesmas regras das telas
// (filaRet dos Retornos, atrasados e "aguardando o cliente" do Painel,
// servAFinalizar). A IA só recebe esse resumo pronto e escreve a resposta:
// não consulta o banco, não soma nada que não esteja aqui. Assim o número
// que ela fala é o mesmo número que a tela mostra.
//
// Cada linha leva um código curto (C1, S1, E1). A IA devolve os códigos que
// citou, e o app transforma em atalhos para a ficha — os ids nunca saem
// do aparelho.
//
// Só leitura: nada aqui grava no banco.
let _assist = { fio:[], mapa:{} };
const ASSIST_MAX_FIO = 3;   // perguntas anteriores enviadas junto, para "e dele?"

function vozSituacao(){
  const h = hoje(), L = [], mapa = {};
  const dias = d => Math.round((parseISO(h) - parseISO(d)) / 86400000);
  const reg = (p, i, rota, rotulo) => { const c = p + (i + 1); mapa[c] = { rota, rotulo }; return c; };
  const cliNome = id => { const c = cliente(id); return c ? nomeC(c) : 'sem cliente'; };
  const cliCod = {};
  S.clientes.forEach((c, i) => { cliCod[c.id] = reg('C', i, '#/cliente/' + c.id, nomeC(c)); });

  L.push(`HOJE: ${h} (${fmtDataLonga(h)})`);

  const { atr, hj, prox } = filaRet();
  const linhaRet = c => `${cliCod[c.id]} ${nomeC(c)} — ${ST_CLI[c.status]?.[0] || c.status} — retorno ${fmtData(c.proximo_contato)}`
    + (c.proximo_contato < h ? ` (ATRASADO ${dias(c.proximo_contato)} dia(s))` : c.proximo_contato === h ? ' (HOJE)' : '')
    + (c.ultimo_contato ? ` — último contato ${fmtData(c.ultimo_contato)}` : '') + (c.whatsapp ? '' : ' — sem WhatsApp')
    + (c.observacoes ? ` — obs: ${c.observacoes.replace(/\s+/g, ' ').slice(0, 160)}` : '');
  L.push(`\nRETORNOS ATRASADOS (${atr.length}):`, ...atr.map(linhaRet));
  L.push(`\nRETORNOS DE HOJE (${hj.length}):`, ...hj.map(linhaRet));
  L.push(`\nRETORNOS DOS PRÓXIMOS 7 DIAS (${prox.length}):`, ...prox.map(linhaRet));

  const enviados = S.orcs.filter(o => o.status === 'enviado');
  const totEnv = enviados.reduce((t, o) => t + totaisOrc(o.id).total, 0);
  L.push(`\nORÇAMENTOS EMITIDOS ESPERANDO RESPOSTA (${enviados.length}, total ${money(totEnv)}):`);
  enviados.forEach((o, i) => {
    const c = reg('E', i, '#/orc/' + o.id, 'Orçamento ' + numOrc(o));
    const venc = o.emissao ? addDias(o.emissao, num(o.validade_dias) || 15) : null;
    L.push(`${c} nº ${numOrc(o)} — ${o.cliente_nome || cliNome(o.cliente_id)}${o.cliente_id ? ' (' + cliCod[o.cliente_id] + ')' : ''} — ${money(totaisOrc(o.id).total)}`
      + (o.emissao ? ` — emitido ${fmtData(o.emissao)}, há ${dias(o.emissao)} dia(s)` : '') + (venc ? (venc < h ? ` — VALIDADE VENCIDA em ${fmtData(venc)}` : ` — vale até ${fmtData(venc)}`) : ''));
  });
  const rasc = S.orcs.filter(o => o.status === 'rascunho');
  L.push(`\nORÇAMENTOS EM RASCUNHO, AINDA NÃO EMITIDOS (${rasc.length}):`);
  rasc.forEach((o, i) => { const c = reg('B', i, '#/orc/' + o.id, 'Rascunho · ' + (o.cliente_nome || cliNome(o.cliente_id)));
    L.push(`${c} ${o.cliente_nome || cliNome(o.cliente_id)} — ${money(totaisOrc(o.id).total)} — criado ${fmtData(String(o.created_at).slice(0, 10))}`); });

  // Serviços: mesmo recorte do app (finalizado e cancelado ficam fora).
  const abertos = S.servicos.filter(s => !s.finalizado_em && s.status !== 'cancelado');
  L.push(`\nSERVIÇOS EM ABERTO (${abertos.length}):`);
  abertos.forEach((s, i) => {
    const c = reg('S', i, '#/serv/' + s.id, s.descricao), t = totaisServ(s.id);
    const ags = agendasDe(s.id).map(a => a.data).sort(), futuro = ags.find(d => d >= h), ult = ags.filter(d => d < h).pop();
    const recAtr = S.receb.filter(r => r.servico_id === s.id && !r.recebido_em && r.previsao && r.previsao < h);
    const repP = S.vinc.filter(v => v.servico_id === s.id && v.repasse_status !== 'pago');
    L.push(`${c} ${s.descricao} — ${cliNome(s.cliente_id)}${s.cliente_id ? ' (' + cliCod[s.cliente_id] + ')' : ''} — ${ST_SERV[s.status]?.[0] || s.status}`
      + (s.status === 'executado' ? ' (FEITO, FALTA FINALIZAR: o lucro só vai para o Fullfin depois)' : '')
      + (futuro ? ` — próximo dia ${fmtData(futuro)}` : s.status !== 'executado' ? ' — SEM DIA MARCADO' : '') + (ult ? ` — último dia ${fmtData(ult)}` : '')
      + ` — cobrado ${money(s.valor_cobrado)}, recebido ${money(t.recebido)}, falta receber ${money(t.aReceber)}`
      + (recAtr.length ? ` (ATRASADO: ${recAtr.map(r => r.descricao + ' ' + money(r.valor) + ' previsto ' + fmtData(r.previsao)).join('; ')})` : '')
      + ` — gastos lançados ${money(t.gastoReal)}` + (t.gastoImprev ? ` (imprevistos ${money(t.gastoImprev)})` : '') + (repP.length ? ` — repasse a pagar: ${repP.map(v => (prestador(v.prestador_id)?.nome || 'a definir') + ' ' + money(v.valor_repasse)).join('; ')}` : ''));
  });

  const ag = S.agendas.filter(a => a.data >= h && a.data <= addDias(h, 7) && agAtiva(a)).sort((a, b) => (a.data + (a.horario_inicio || '')).localeCompare(b.data + (b.horario_inicio || '')));
  L.push(`\nAGENDA DO TRABALHO DE HOMEM, PRÓXIMOS 7 DIAS (${ag.length}):`);
  ag.forEach(a => { const s = serv(a.servico_id); L.push(`${fmtDataLonga(a.data)} ${a.horario_inicio ? hhmm(a.horario_inicio) + (a.horario_fim ? '–' + hhmm(a.horario_fim) : '') : 'dia todo'} — ${s.descricao} — ${cliNome(s.cliente_id)}`); });
  const dil = S.dil.filter(d => d.data >= h && d.data <= addDias(h, 7));
  L.push(`\nDILIGÊNCIAS DO ESDRAS, PRÓXIMOS 7 DIAS (${S.dilOk ? dil.length : 'não consegui ler'}):`);
  dil.forEach(d => L.push(`${fmtDataLonga(d.data)} ${d.horario ? hhmm(d.horario) : ''} — diligência${d.local ? ' em ' + d.local : ''}`));

  const cred = saldosLoja().filter(x => x.devol || x.uso);
  L.push(`\nCRÉDITOS EM LOJA (material devolvido que virou crédito; saldo = devolvido − usado):`, ...cred.map(x => `${x.nome}: saldo ${money(x.saldo)} (devolvido ${money(x.devol)}, usado ${money(x.uso)})`));
  L.push(`\nLANÇAMENTOS PELA CONTA PF ESPERANDO ACERTO: ${totPendPF()}`);
  L.push(`\nTODOS OS CLIENTES (código — nome — status):`, ...S.clientes.map(c => `${cliCod[c.id]} ${nomeC(c)} — ${ST_CLI[c.status]?.[0] || c.status}${c.nao_contatar ? ' — não quer contato' : ''}`));
  return { texto:L.join('\n'), mapa };
}

// Vai junto em todo envio de voz: se a fala for pergunta, a function já tem
// com o que responder sem uma segunda viagem. Em conversa aberta, vai o
// modo "consulta" (pula a escolha de ação) e as últimas perguntas.
function vozAnexarContexto(fd){
  // Erro aqui não pode derrubar o comando de gasto: sem situação, só a
  // pergunta deixa de funcionar (a function avisa).
  try { const sit = vozSituacao(); _assist.mapa = sit.mapa; fd.append('situacao', sit.texto); }
  catch(e) { console.error('situação', e); }
  if (_assist.aberto) {
    fd.append('modo', 'consulta');
    fd.append('historico', JSON.stringify(_assist.fio.slice(-ASSIST_MAX_FIO).map(x => ({ p:x.p, r:x.r }))));
  }
}

  if (!_assist.fecharOrig) {

    </div>
    ${_assist.fio.length ? '' : `<div class="hint" style="font-size:12.5px;color:var(--text3);margin-top:10px">Exemplos: “o que está atrasado?” · “quem eu preciso retornar hoje?” · “e a Setup, falta o quê?” · “o que tenho amanhã?” · “quanto tenho para receber?”</div>`}
    <div class="hint" style="font-size:12px;color:var(--text3);margin-top:8px">Pode dar ordem aqui também (“o Alessandro aprovou”, “recebi 300 da Setup”): abre a tela para você confirmar. Nada é gravado sem o seu toque.</div>`);
  assistRolar();
}
function assistFioHtml(){
  return _assist.fio.map(x => `<div class="as-p">${esc(x.p)}</div><div class="as-r">${esc(x.r)}${x.itens?.length ? `<div class="as-itens">${x.itens.map(c =>
    `<a href="${_assist.mapaFio?.[c]?.rota || '#'}" onclick="closeModal()">${esc(_assist.mapaFio?.[c]?.rotulo || c)} ›</a>`).join('')}</div>` : ''}
    <div style="margin-top:6px"><button class="lnk" style="border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:0;font-size:13px" onclick="assistOuvir(this)" data-t="${esc(x.r)}">Ouvir</button></div></div>`).join('');
}
function assistRolar(){ const f = $('as-fio'); if (f) f.lastElementChild?.scrollIntoView({ block:'end' }); }

async function assistEnviarTexto(){
  const t = fv('as-txt').trim(); if (!t || _voz.ocupado) return;
  _voz.ocupado = true; loading(true);
  try {
    if (sess?.expires_at && sess.expires_at - 60 < Date.now()/1000) await refreshSess();
    if (!sess?.access_token) throw new Error('Entre de novo no app.');
    const fd = new FormData();
    fd.append('texto', t); fd.append('hoje', hoje());
    vozAnexarContexto(fd);
    const r = await fetch(VOZ_URL, { method:'POST', headers:{ Authorization:'Bearer ' + sess.access_token, apikey:SB_KEY }, body:fd });
    const j = await r.json().catch(() => ({ ok:false, erro:'resposta inválida (' + r.status + ')' }));
    if (!j.ok) return toast(j.erro || 'Falhou.', true);
    $('as-txt') && ($('as-txt').value = '');
    vozAplicar(j);
  } catch(e) { toast(e?.message || 'Sem conexão.', true); }
  finally { _voz.ocupado = false; loading(false); }
}

// Resposta chega por voz (vozEnviar) ou por texto. Os códigos citados só
// viram atalho se existirem no mapa montado no aparelho.
function assistResposta(j){
  const mapa = _assist.mapa || {};
  _assist.mapaFio = { ...(_assist.mapaFio || {}), ...mapa };
  const itens = (j.itens || []).filter(c => mapa[c]).slice(0, 8);
  _assist.fio.push({ p:j.transcricao, r:j.resposta || 'Sem resposta.', itens });
  if (_assist.fio.length > 20) _assist.fio = _assist.fio.slice(-20);
  if (_assist.aberto && $('as-fio')) { $('as-fio').innerHTML = assistFioHtml(); $('as-txt').value = ''; assistRolar(); }
  else assistAbrir();
}

// Leitura em voz alta pelo próprio celular (sem custo de API). Só quando a
// pessoa toca: falar sozinho no meio de um cliente seria pior que ler.
function assistOuvir(el){
  try {
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
    const u = new SpeechSynthesisUtterance(el.dataset.t); u.lang = 'pt-BR';
    const v = speechSynthesis.getVoices().find(x => /pt[-_]BR/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) { toast('Este aparelho não lê em voz alta.', true); }
}

function finalizarServ(sid){
  const s = serv(sid);
  // Sem nenhum gasto o lucro sai igual ao recebido: quase sempre é nota
  // esquecida, então avisa antes de gravar.
  const semGasto = !gastosDe(sid).length && num(s.custo_material) > 0
    ? `<b>Nenhum gasto lançado</b>, e o orçamento previa ${money(s.custo_material)} de material. Se teve compra, volte e lance antes.<br><br>` : '';
  confirmar('Finalizar serviço', `${semGasto}O lucro é gravado e fica disponível para importar no Fullfin. Gastos, recebimentos e repasses deste serviço ficam travados.`, 'Finalizar', async () => {
    const ok = await act(async () => { await db.rpc('tdh_finalizar_servico', { p_sid:sid }); await load('servicos'); return true; });
    if (ok) { toast('Finalizado. Lucro de ' + money(serv(sid).lucro_final) + ' pronto para o Fullfin.'); go('#/serv/' + sid); }
  });
}
function reabrirServ(sid){
  confirmar('Reabrir serviço', 'Os valores voltam a ser editáveis. Ao finalizar de novo, o lucro novo aparece para importar no Fullfin.', 'Reabrir', async () => {
    const res = await act(async () => { const r = await db.rpc('tdh_reabrir_servico', { p_sid:sid }); await load('servicos'); return r || {}; });
    if (!res) return;
    if (res.ja_importado) openModal('Acerte no Fullfin', `<p style="margin:-4px 0 12px">O lucro de <b class="money">${money(res.lucro)}</b> deste serviço já foi importado no Fullfin.</p>
      <p style="margin:0 0 14px;color:var(--text2)">Apague ou ajuste aquele lançamento lá (procure por "Lucro — ${esc(serv(sid)?.descricao || '')}"). Quando finalizar de novo, o valor novo aparece para importar, e os dois ficariam somados se o antigo continuar.</p>
      <button class="btn btn-p btn-w" onclick="closeModal();rerender()">Entendi</button>`);
    else { toast('Reaberto.'); rerender(); }
  });
}
// Executado mas não finalizado: o lucro ainda não foi para o Fullfin.
const servAFinalizar = () => S.servicos.filter(s => s.status === 'executado' && !s.finalizado_em);

// ── Números do mês ─────────────────────────────────────────────────
// Regime de caixa: conta o que entrou e saiu no mês, pela data em que o
// dinheiro andou. É o que bate com o extrato. O lucro de cada obra, que
// junta datas diferentes, fica na tela do serviço.
function finMes(mes){
  const no = d => (d || '').startsWith(mes);
  const receb = S.receb.filter(r => no(r.recebido_em) && servExiste(r.servico_id));
  const gastos = S.gastos.filter(g => no(g.data));
  const reps = S.vinc.filter(v => v.repasse_status === 'pago' && no(v.repassado_em));
  const transf = S.transf.filter(t => no(t.data));
  const soma = (a, f) => a.reduce((t,x) => t + num(f(x)), 0);
  const fat = soma(receb, r => r.valor);
  // Caixa: parte paga com crédito de loja não saiu da conta.
  const gObra = soma(gastos.filter(g => g.servico_id), pago);
  const gFixo = soma(gastos.filter(g => !g.servico_id), pago);
  const rep = soma(reps, v => v.valor_repasse);
  // Retirada = lucro que foi para você: transferência PJ → você que não
  // seja reembolso, mais recebimento da PF que ficou com você.
  const retirado = soma(transf.filter(t => t.sentido === 'para_voce' && !t.gasto_id && !t.repasse_id), t => t.valor)
    + soma(receb.filter(r => r.conta === 'pf' && r.acerto === 'retirada'), r => r.valor);
  const aporte = soma(transf.filter(t => t.sentido === 'para_empresa' && !t.recebimento_id), t => t.valor)
    + soma(gastos.filter(g => g.conta === 'pf' && g.acerto === 'aporte'), pago)
    + soma(reps.filter(v => v.conta === 'pf' && v.acerto === 'aporte'), v => v.valor_repasse);
  const porCat = {}; gastos.forEach(g => porCat[g.categoria] = (porCat[g.categoria] || 0) + pago(g));
  return { fat, gObra, gFixo, rep, lucro: fat - gObra - gFixo - rep, retirado, aporte, porCat,
    fixos: gastos.filter(g => !g.servico_id), transf, nReceb: receb.length };
}
// Saldo que deveria estar na conta PJ, desde o começo. Não tem saldo
// inicial próprio: se a conta já tinha dinheiro, lance uma transferência
// "Você → PJ" com esse valor e a descrição "Saldo inicial".
function saldoPJ(){
  const soma = (a, f) => a.reduce((t,x) => t + num(f(x)), 0);
  return soma(S.receb.filter(r => r.conta === 'pj' && r.recebido_em && servExiste(r.servico_id)), r => r.valor)
    - soma(S.gastos.filter(g => g.conta === 'pj'), pago)
    - soma(S.vinc.filter(v => v.conta === 'pj' && v.repasse_status === 'pago'), v => v.valor_repasse)
    + soma(S.transf.filter(t => t.sentido === 'para_empresa'), t => t.valor)
    - soma(S.transf.filter(t => t.sentido === 'para_voce'), t => t.valor);
}

function vFinanceiro(r){
  const mes = /^\d{4}-\d{2}$/.test(r.id || '') ? r.id : hoje().slice(0,7);
  const [y, m] = mes.split('-').map(Number);
  const prev = m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;

function chipsHtml(id, opts, marcadas){

function chipNovo(id){ const v = prompt('Nome:'); if (!v?.trim()) return; const b = document.createElement('button'); b.type = 'button'; b.className = 'chip on';

async function salvarPrestador(pid){
  const nome = fv('pr-nome').trim(); if (!nome) return toast('Coloque o nome.', true);
  const row = { nome, whatsapp:fv('pr-wa').trim() || null, email:fv('pr-mail').trim() || null, especialidades:chipsSel('pr-esp'), cidades:chipsSel('pr-cid'),

async function toggleAtivoPrest(pid){

/* ═══════════════════════════════════════════════════════════════════
   CLIENTES E RETORNOS
   ═══════════════════════════════════════════════════════════════════ */
/* ── Retornos (acompanhamento de contatos) ──────────────────────────
   Todo cliente é também um contato que pode ser chamado de volta. Não
   existe tabela de "leads" separada: com duas, quem fecha serviço ficaria
   cadastrado duas vezes, e a reciclagem mandaria "tem algum serviço pra
   mim?" para quem está com obra em andamento.

   As regras automáticas moram no BANCO (previmater-ops/_sql/
   tdh_02_followup.sql), não aqui:
     orçamento enviado → retorno em 2 dias; aprovado → limpa o retorno;
     recusado / perdido / adormecido → volta em 150 dias;
     serviço executado → pós-venda em 75 dias; "não quer contato" → nunca.
   O app só grava status e datas. Assim a regra vale igual vindo desta
   tela, da emissão de um orçamento ou de qualquer outro lugar. Por isso,
   depois de gravar, o app usa a linha que o banco DEVOLVE (já com a data
   que o trigger calculou), e não a que mandou.
   Prazos editáveis em Configurações (tdh_config.followup_*).
   O resumo por e-mail das 07:30 é a function tdh-followup. */
const ST_CLI = { novo:['Novo','b-blue'], conversando:['Conversando','b-yel'], orcamento_enviado:['Orçamento enviado','b-navy'],
  fechado:['Fechado','b-green'], perdido:['Perdido','b-red'], adormecido:['Adormecido','b-gray'] };
const ORIGENS = ['Indicação','Instagram','Facebook','Google','Vídeo','WhatsApp','Panfleto/placa','Cliente antigo','Outro'];
// Mesmas mensagens do e-mail (function tdh-followup, constante MODELOS).
// Mudou uma, muda a outra.
const MODELOS = {
  novo:'Oi{nome}, tudo bem? Aqui é o Esdras, do Trabalho de Homem. Conseguiu pensar naquele serviço? Se quiser, já te passo um orçamento.',
  conversando:'Oi{nome}, tudo bem? Aqui é o Esdras, do Trabalho de Homem. Conseguiu pensar naquele serviço? Se quiser, já te passo um orçamento.',
  orcamento_enviado:'Oi{nome}, tudo bem? Aqui é o Esdras, do Trabalho de Homem. Conseguiu ver o orçamento que te mandei? Qualquer dúvida, estou à disposição.',
  fechado:'Oi{nome}, tudo bem? Aqui é o Esdras, do Trabalho de Homem. Passando para saber se ficou tudo certo com o serviço e se tem mais alguma coisa que eu possa resolver para você.',
  perdido:'Oi{nome}, tudo bem? Aqui é o Esdras, do Trabalho de Homem. Passando para lembrar que sigo atendendo Pinhais, Curitiba e região. Precisando de algum reparo, é só chamar!',
  adormecido:'Oi{nome}, tudo bem? Aqui é o Esdras, do Trabalho de Homem. Passando para lembrar que sigo atendendo Pinhais, Curitiba e região. Precisando de algum reparo, é só chamar!',
};
// Número sem DDI, para achar repetido mesmo digitado de jeitos diferentes.
const foneBase = t => { let d = onlyDigits(t); if ((d.length === 12 || d.length === 13) && d.startsWith('55')) d = d.slice(2); return d; };
// Número que vira link direto para a conversa, igual ao Previmater CRM
// (foneLink de lá). Abre o WhatsApp sem mensagem pronta: é para falar o que
// quiser. O botão "WhatsApp" dos Retornos é que leva a mensagem-modelo.
// stopPropagation: a linha inteira abre a ficha; tocar no número abre só o
// WhatsApp. Número incompleto (sem DDD) fica como texto, para não virar link
// que abre conversa com o número errado.
function foneLink(t){
  const d = foneBase(t);
  if (d.length < 10) return esc(t || '');
  return `<a href="${waLink(d)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--green);font-weight:700;text-decoration:none;white-space:nowrap">${ic('phone')} ${esc(foneFmt(d))}</a>`;
}
function foneFmt(t){ const d = foneBase(t);
  return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : (t || ''); }
// Contato pode ter só o número (nome deixou de ser obrigatório).
const nomeC = c => c?.nome || foneFmt(c?.whatsapp) || 'Sem nome';
const badgeCli = c => `<span class="badge ${ST_CLI[c.status]?.[1] || 'b-gray'}">${ST_CLI[c.status]?.[0] || c.status}</span>`;
function waRetorno(c){ const p = (c.nome || '').trim().split(/\s+/)[0];
  return waLink(c.whatsapp, (MODELOS[c.status] || MODELOS.conversando).replace('{nome}', p ? ' ' + p : '')); }
const naFila = c => c.proximo_contato && !c.nao_contatar;
function quandoRet(c){
  if (!c.proximo_contato) return '';
  const d = Math.round((parseISO(hoje()) - parseISO(c.proximo_contato)) / 86400000);
  if (d > 0) return `<b style="color:var(--red);font-size:12.5px;white-space:nowrap">atrasado ${d} dia${d > 1 ? 's' : ''}</b>`;
  if (d === 0) return `<b style="color:#8A5A06;font-size:12.5px">hoje</b>`;
  if (d === -1) return `<span style="color:var(--text3);font-size:12.5px">amanhã</span>`;
  return `<span style="color:var(--text3);font-size:12.5px;white-space:nowrap">${DSEM[parseISO(c.proximo_contato).getDay()]} ${fmtData(c.proximo_contato).slice(0,5)}</span>`;
}
function filaRet(){
  const h = hoje(), sem = addDias(h, 7);
  const f = S.clientes.filter(naFila).sort((a,b) => a.proximo_contato.localeCompare(b.proximo_contato));
  return { atr:f.filter(c => c.proximo_contato < h), hj:f.filter(c => c.proximo_contato === h), prox:f.filter(c => c.proximo_contato > h && c.proximo_contato <= sem) };
}
// Linha com ações embaixo. O nome leva à ficha; os botões agem direto.
function rowRet(c){
  const atr = c.proximo_contato < hoje(), hj = c.proximo_contato === hoje();
  const local = [c.bairro, c.cidade].filter(Boolean).join(', ');

    <div class="main" style="cursor:pointer" onclick="go('#/cliente/${c.id}')"><div class="t">${esc(nomeC(c))}</div>
      <div class="m">${badgeCli(c)}${c.whatsapp ? ' · ' + foneLink(c.whatsapp) : ''}${local ? ' · ' + esc(local) : ''}</div>
      ${c.observacoes ? `<div class="m" style="color:var(--text2);margin-top:4px">${esc(c.observacoes.length > 140 ? c.observacoes.slice(0,140) + '…' : c.observacoes)}</div>` : ''}</div>
    <div class="r">${quandoRet(c)}</div>
    <div class="ret-acoes">
      ${waRetorno(c) ? `<button class="btn btn-sm btn-n" style="flex:1.5" onclick="retWhats('${c.id}')">${ic('phone')} WhatsApp</button>` : ''}
      <button class="btn btn-sm btn-s" onclick="folhaRet('${c.id}')">Adiar</button>
      <button class="btn btn-sm btn-s" onclick="retFechou('${c.id}')">Fechou</button>
      <button class="btn btn-sm btn-d" onclick="retPerdeu('${c.id}')">Perdeu</button>
    </div></div>`;
}
// Versão curta para o Painel: o painel também mostra dinheiro e agenda,
// e a lista completa com botões está a um toque, em Retornos.
function rowRetCurta(c){
  const wa = waRetorno(c);
  return `<div class="row" style="cursor:default"><a class="main" href="#/cliente/${c.id}" style="text-decoration:none;color:inherit">
    <div class="t">${esc(nomeC(c))}</div><div class="m">${badgeCli(c)} ${quandoRet(c)}</div></a>
    ${wa ? `<button class="btn btn-sm btn-n" onclick="retWhats('${c.id}')" title="Chamar no WhatsApp">${ic('phone')}</button>` : ''}</div>`;
}
function painelRetornos(){
  const { atr, hj } = filaRet(), l = [...atr, ...hj];
  return `<div class="sec" style="margin-top:4px">Retornos de hoje <a class="lnk" href="#/retornos">Ver todos</a></div>

      + (l.length > 5 ? `<a class="row" href="#/retornos"><div class="main"><div class="t" style="color:var(--blue)">Mais ${l.length - 5}…</div></div>${ic('right')}</a>` : '')
      : '<div class="empty">Nenhum retorno para hoje.</div>'}</div>`;
}
function vRetornos(){
  const { atr, hj, prox } = filaRet();
  const sec = (t, l) => l.length ? `<div class="sec">${t} · ${l.length}</div><div class="list">${l.map(rowRet).join('')}</div>` : '';
  const corpo = sec('Atrasados', atr) + sec('Para hoje', hj) + sec('Próximos 7 dias', prox);
  return `
  <div class="pg-head"><div><h2 class="pg">Retornos</h2><div class="pg-sub">Quem chamar de volta</div></div>
    <a class="btn btn-sm btn-s" href="#/clientes">Todos os contatos</a></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="kpi"><div class="k">Atrasados</div><div class="v" style="${atr.length ? 'color:var(--red)' : ''}">${atr.length}</div></div>
    <div class="kpi"><div class="k">Hoje</div><div class="v">${hj.length}</div></div>
    <div class="kpi"><div class="k">Próx. 7 dias</div><div class="v">${prox.length}</div></div>
  </div>
  ${corpo || `<div class="card empty" style="margin-top:12px">${S.clientes.length ? 'Nenhum retorno pendente.' : 'Nenhum contato ainda.'}<br>
    Cadastre quem você atendeu no WhatsApp para o app lembrar de chamar de volta.</div>`}
  <div style="height:64px"></div><button class="btn btn-p fab" onclick="modalCliente(null, null, { status:'conversando', proximo_contato:addDias(hoje(), 2) })">${ic('plus')} Novo contato</button>`;
}
async function gravaCli(cid, patch, msg){
  return act(async () => { const [n] = await db.upd('tdh_clientes', eqId(cid), patch); Object.assign(cliente(cid), n); return n; }, msg);
}
async function retWhats(cid){
  const c = cliente(cid); window.open(waRetorno(c), '_blank', 'noopener');
  // Abrir a conversa conta como contato feito. Em seguida pergunta o
  // próximo passo, para o retorno de hoje não ficar pendurado na fila.
  await gravaCli(cid, { ultimo_contato:hoje() });
  folhaRet(cid, true);
}
function folhaRet(cid, posWhats){
  const c = cliente(cid);
  // Depois do WhatsApp, "conversando" é o status provável de quem era novo.
  const prom = posWhats && c.status === 'novo' ? `'conversando'` : 'null';

function cliRap(n){
  if (n !== undefined) $('cl-prox').value = n === '' ? '' : addDias(hoje(), n);
  const v = fv('cl-prox');
  document.querySelectorAll('#cl-rap .chip').forEach(b => b.classList.toggle('on', b.dataset.n === '' ? !v : !!v && addDias(hoje(), +b.dataset.n) === v));

// Aviso de número repetido: o mesmo cliente volta pelo WhatsApp e
// acabaria com dois cadastros, cada um com metade do histórico.
function cliDup(cid){
  const d = foneBase(fv('cl-wa'));
  const o = d.length >= 10 && S.clientes.find(x => x.id !== cid && foneBase(x.whatsapp) === d);
  // Atalho para a conversa já no cadastro: dá para salvar e chamar em seguida.
  $('cl-walink').innerHTML = d.length >= 10 ? `<div style="margin:-6px 0 10px;font-size:13.5px">Abrir conversa: ${foneLink(d)}</div>` : '';
  $('cl-dup').innerHTML = o ? `<div class="warn">${ic('alert')}<span>Esse número já está cadastrado: <a href="#/cliente/${o.id}" style="color:inherit;font-weight:700">${esc(nomeC(o))}</a></span></div>` : '';
}
async function salvarCliente(cid){
  const nome = fv('cl-nome').trim(), wa = fv('cl-wa').trim();
  if (!nome && !wa) return toast('Coloque o nome ou o WhatsApp.', true);
  if (wa && foneBase(wa).length < 10) return toast('WhatsApp incompleto: coloque o DDD.', true);
  const row = { nome:nome || null, whatsapp:wa || null, documento:fv('cl-doc').trim() || null, endereco:fv('cl-end').trim() || null,
    bairro:fv('cl-bai').trim() || null, cidade:fv('cl-cid').trim() || null, observacoes:fv('cl-obs').trim() || null,
    origem:fv('cl-ori') || null, status:fv('cl-st'), nao_contatar:$('cl-nao').checked };
  // Data só vai junto se foi mexida (ou é cadastro novo). Se ela for
  // reenviada igual, o banco entende como "você escolheu manter esta data"
  // e não aplica o prazo automático de quem acabou de virar perdido.
  const orig = window._cliOrig, prox = fv('cl-prox') || null;
  if (!orig || (prox || '') !== orig.data) row.proximo_contato = prox;
  const depois = window._cliDepois;
  const id2 = await act(async () => {
    if (cid) { const [n] = await db.upd('tdh_clientes', eqId(cid), row); Object.assign(cliente(cid), n); return cid; }
    const [n] = await db.ins('tdh_clientes', row); S.clientes.push(n); return n.id;
  }, 'Salvo.');
  if (!id2) return;
  closeModal(); if (depois) depois(id2); else rerender();
}

let _instalar = null;

}

/* ═══ Modo invisível: conversa com o Concierge ═══════════════════════
   Mensagens só da janela de cima e do mesmo endereço (github.io do
   Esdras). 'token' → carrega os dados; 'contexto' → devolve o resumo do
   assistente. Dados com mais de 60 s são recarregados antes de responder,
   para a resposta não sair velha com o Concierge aberto há tempo. */
function sitIniciar(){
  let carregado = 0, carregando = null;
  const avisa = m => parent.postMessage({ cc:1, app:'tdh', ...m }, location.origin);
  const carregar = () => carregando || (carregando = (async () => {
    const cfg = await loadCfg();
    // Config vazia = este login não tem acesso ao TDH (mesma regra do start).
    if (!cfg) throw new Error('Este login não tem acesso ao Trabalho de Homem.');
    await Promise.all([load(...Object.keys(TAB)), loadDiligencias(), loadCarteiras()]);
    carregado = Date.now();
  })().finally(() => { carregando = null; }));
  window.addEventListener('message', async e => {
    if (e.source !== parent || e.origin !== location.origin || !e.data?.cc) return;
    const d = e.data;
    try {
      if (d.tipo === 'token') {
        sess = { access_token:d.token, expires_at:d.expira, user:{ id:d.user_id } };
        await carregar(); avisa({ tipo:'pronto' });
      } else if (d.tipo === 'contexto') {
        // O Concierge manda o passe renovado junto: este modo nunca renova.
        if (d.token) sess = { access_token:d.token, expires_at:d.expira, user:{ id:d.user_id } };
        if (!sess?.access_token) throw new Error('sem login');
        if (Date.now() - carregado > 60000) await carregar();
        const sit = vozSituacao();
        avisa({ tipo:'contexto', id:d.id, situacao:sit.texto, mapa:sit.mapa });
      }
    } catch(err) { avisa({ tipo:'erro', id:d.id, erro:err?.message || 'falha ao carregar' }); }
  });
  avisa({ tipo:'aberto' });
}

/* ═══ Início ═════════════════════════════════════════════════════════ */
if (MODO_SIT) sitIniciar();
else {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (sess?.access_token) start(); else $('login').classList.remove('hidden');
}
</script>
