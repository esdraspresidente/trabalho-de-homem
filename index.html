      <div class="m">${esc((p.especialidades || []).join(' · ') || 'Sem especialidade')}${vs.length ? ` · ${vs.length} serviço(s)` : ''}${pend ? ` · a pagar <span class="money">${money(pend)}</span>` : ''}</div></div>${ic('right')}</button>`; }).join('')
    : '<div class="empty">Ninguém aqui ainda.</div>'}</div>
  <div style="height:64px"></div><button class="btn btn-p fab" onclick="modalPrestador()">${ic('plus')} Novo prestador</button>`;
}
function chipsHtml(id, opts, marcadas){
  const extra = (marcadas || []).filter(m => !opts.includes(m));
  return `<div class="chips" id="${id}">${[...opts, ...extra].map(o => `<button type="button" class="chip ${marcadas?.includes(o) ? 'on' : ''}" onclick="this.classList.toggle('on')">${esc(o)}</button>`).join('')}
    <button type="button" class="chip" style="border-style:dashed" onclick="chipNovo('${id}')">+ outra</button></div>`;
}
function chipNovo(id){ const v = prompt('Nome:'); if (!v?.trim()) return; const b = document.createElement('button'); b.type = 'button'; b.className = 'chip on';
  b.textContent = v.trim(); b.onclick = () => b.classList.toggle('on'); const box = $(id); box.insertBefore(b, box.lastElementChild); }
const chipsSel = id => [...$(id).querySelectorAll('.chip.on')].map(c => c.textContent.trim());
function modalPrestador(pid, depois){
  const p = pid ? prestador(pid) : null;
  window._prestDepois = depois || null;
  const wa = p?.whatsapp ? waLink(p.whatsapp) : null;
  openModal(p ? p.nome : 'Novo prestador', `
    ${p ? `<div class="btns" style="margin-bottom:12px">${wa ? `<a class="btn btn-sm btn-s" href="${wa}" target="_blank" rel="noopener">${ic('phone')} WhatsApp</a>` : ''}
      ${p.pix ? `<button class="btn btn-sm btn-s" onclick="copiarPix('${p.id}')">${ic('copy')} Copiar PIX</button>` : ''}</div>` : ''}
    <div class="field"><label>Nome</label><input class="in" id="pr-nome" value="${esc(p?.nome || '')}"></div>
    <div class="f2"><div class="field"><label>WhatsApp</label><input class="in" id="pr-wa" inputmode="tel" value="${esc(p?.whatsapp || '')}"></div>
      <div class="field"><label>E-mail</label><input class="in" id="pr-mail" type="email" value="${esc(p?.email || '')}"></div></div>
    <div class="field"><label>O que faz</label>${chipsHtml('pr-esp', ESPECIALIDADES, p?.especialidades)}</div>
    <div class="field"><label>Onde atende</label>${chipsHtml('pr-cid', CIDADES, p?.cidades)}</div>
    <div class="f2"><div class="field"><label>Tipo de PIX</label><select class="in" id="pr-pixt">${['','CPF','CNPJ','Celular','E-mail','Aleatória'].map(t => `<option ${p?.pix_tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Chave PIX</label><input class="in" id="pr-pix" value="${esc(p?.pix || '')}"></div></div>
    <div class="field"><label>Valor padrão / diária (R$)</label><input class="in num" id="pr-dia" inputmode="decimal" value="${p ? moneyIn(p.diaria_padrao) : ''}">
      <div class="hint">Só sugere o repasse. O que vale é o valor em cada serviço.</div></div>
    <div class="field"><label>Observações</label><textarea class="in" id="pr-obs">${esc(p?.observacoes || '')}</textarea></div>
    <div class="btns"><button class="btn btn-p" style="flex:1" onclick="salvarPrestador(${p ? `'${p.id}'` : 'null'})">Salvar</button>
      ${p ? `<button class="btn btn-s" onclick="toggleAtivoPrest('${p.id}')">${p.ativo ? 'Desativar' : 'Reativar'}</button>` : ''}</div>`);
}
async function salvarPrestador(pid){
  const nome = fv('pr-nome').trim(); if (!nome) return toast('Coloque o nome.', true);
  const row = { nome, whatsapp:fv('pr-wa').trim() || null, email:fv('pr-mail').trim() || null, especialidades:chipsSel('pr-esp'), cidades:chipsSel('pr-cid'),
    pix_tipo:fv('pr-pixt') || null, pix:fv('pr-pix').trim() || null, diaria_padrao:parseMoney(fv('pr-dia')) || null, observacoes:fv('pr-obs').trim() || null };
  const depois = window._prestDepois;
  const id2 = await act(async () => {
    if (pid) { const [n] = await db.upd('tdh_prestadores', eqId(pid), row); Object.assign(prestador(pid), n); return pid; }
    const [n] = await db.ins('tdh_prestadores', row); S.prestadores.push(n); S.prestadores.sort((a,b) => a.nome.localeCompare(b.nome)); return n.id;
  }, 'Salvo.');
  if (!id2) return;
  closeModal(); if (depois) depois(id2); else rerender();
}
async function toggleAtivoPrest(pid){
  const p = prestador(pid);
  const ok = await act(async () => { const [n] = await db.upd('tdh_prestadores', eqId(pid), { ativo:!p.ativo }); Object.assign(p, n); return true; });
  if (ok) { closeModal(); rerender(); }
}

/* ═══════════════════════════════════════════════════════════════════
   CLIENTES
   ═══════════════════════════════════════════════════════════════════ */
let cliBusca = '';
function vClientes(){
  const b = cliBusca.toLowerCase();
  const lista = S.clientes.filter(c => !b || (c.nome + ' ' + (c.bairro || '') + ' ' + onlyDigits(c.whatsapp)).toLowerCase().includes(b));
  return `
  <a class="back" href="#/mais">${ic('left')} Mais</a>
  <div class="pg-head"><h2 class="pg">Clientes</h2></div>
  <div class="search">${ic('search')}<input class="in" placeholder="Buscar nome, bairro, telefone" value="${esc(cliBusca)}" oninput="cliBusca=this.value;filtraCli()"></div>
  <div class="list">${lista.length ? lista.map(c => { const n = S.servicos.filter(s => s.cliente_id === c.id).length;
    return `<a class="row" href="#/cliente/${c.id}"><div class="main"><div class="t">${esc(c.nome)}</div>
      <div class="m">${esc([c.bairro, c.cidade].filter(Boolean).join(' · ') || c.whatsapp || '')}${n ? ` · ${n} serviço(s)` : ''}</div></div>${ic('right')}</a>`; }).join('')
    : '<div class="empty">Nenhum cliente.</div>'}</div>
  <div style="height:64px"></div><button class="btn btn-p fab" onclick="modalCliente()">${ic('plus')} Novo cliente</button>`;
}
function filtraCli(){ const v = cliBusca; render(); const inp = document.querySelector('.search input'); if (inp) { inp.focus(); inp.setSelectionRange(v.length, v.length); } }
function vCliente(r){
  const c = cliente(r.id); if (!c) return `<a class="back" href="#/clientes">${ic('left')} Clientes</a><div class="card empty">Cliente não encontrado.</div>`;
  const os = S.orcs.filter(o => o.cliente_id === c.id), ss = S.servicos.filter(s => s.cliente_id === c.id);
  const wa = waLink(c.whatsapp), end = [c.endereco, c.bairro, c.cidade].filter(Boolean).join(', ');
  const total = ss.filter(s => s.status !== 'cancelado').reduce((t,s) => t + num(s.valor_cobrado), 0);
  return `
  <a class="back" href="#/clientes">${ic('left')} Clientes</a>
  <div class="pg-head"><div><h2 class="pg">${esc(c.nome)}</h2><div class="pg-sub">${ss.length} serviço(s) · ${m$(total)} no total</div></div>
    <button class="btn btn-sm btn-s" onclick="modalCliente('${c.id}')">${ic('edit')} Editar</button></div>
  <div class="card">
    ${wa ? `<a href="${wa}" target="_blank" rel="noopener" style="display:flex;gap:8px;text-decoration:none;font-weight:600;margin-bottom:8px">${ic('phone')} ${esc(c.whatsapp)}</a>` : ''}
    ${end ? `<a href="${mapsLink(end)}" target="_blank" rel="noopener" style="display:flex;gap:8px;text-decoration:none;color:var(--text2)">${ic('pin')} ${esc(end)}</a>` : ''}
    ${c.documento ? `<div style="margin-top:8px;color:var(--text2)">CPF/CNPJ: ${esc(c.documento)}</div>` : ''}
    ${c.observacoes ? `<div style="margin-top:8px;color:var(--text2);white-space:pre-wrap">${esc(c.observacoes)}</div>` : ''}
    ${!wa && !end && !c.documento && !c.observacoes ? '<div style="color:var(--text3)">Sem contato cadastrado.</div>' : ''}
  </div>
  <div class="sec">Serviços</div><div class="list">${ss.length ? ss.map(rowServ).join('') : '<div class="empty">Nenhum serviço.</div>'}</div>
  <div class="sec">Orçamentos</div><div class="list">${os.length ? os.map(rowOrc).join('') : '<div class="empty">Nenhum orçamento.</div>'}</div>
  <div class="btns" style="margin-top:14px"><button class="btn btn-p" onclick="novoOrcamentoPara('${c.id}')">${ic('plus')} Orçamento para ${esc(c.nome.split(' ')[0])}</button></div>`;
}
const novoOrcamentoPara = cid => novoOrcamento(cid);
function modalCliente(cid, depois){
  const c = cid ? cliente(cid) : null;
  window._cliDepois = depois || null;
  openModal(c ? 'Editar cliente' : 'Novo cliente', `
    <div class="field"><label>Nome</label><input class="in" id="cl-nome" value="${esc(c?.nome || '')}"></div>
    <div class="f2"><div class="field"><label>WhatsApp</label><input class="in" id="cl-wa" inputmode="tel" value="${esc(c?.whatsapp || '')}"></div>
      <div class="field"><label>CPF/CNPJ</label><input class="in" id="cl-doc" value="${esc(c?.documento || '')}"><div class="hint">Só se for sair no orçamento.</div></div></div>
    <div class="field"><label>Endereço</label><input class="in" id="cl-end" value="${esc(c?.endereco || '')}"></div>
    <div class="f2"><div class="field"><label>Bairro</label><input class="in" id="cl-bai" value="${esc(c?.bairro || '')}"></div>
      <div class="field"><label>Cidade</label><input class="in" id="cl-cid" value="${esc(c?.cidade || '')}" list="cidades-dl"></div></div>
    <datalist id="cidades-dl">${CIDADES.map(x => `<option value="${x}">`).join('')}</datalist>
    <div class="field"><label>Observações</label><textarea class="in" id="cl-obs">${esc(c?.observacoes || '')}</textarea></div>
    <div class="btns"><button class="btn btn-p" style="flex:1" onclick="salvarCliente(${c ? `'${c.id}'` : 'null'})">Salvar</button>
      ${c && !S.servicos.some(s => s.cliente_id === c.id) && !S.orcs.some(o => o.cliente_id === c.id) ? `<button class="btn btn-d" onclick="excluirCliente('${c.id}')">${ic('trash')}</button>` : ''}</div>`);
}
async function salvarCliente(cid){
  const nome = fv('cl-nome').trim(); if (!nome) return toast('Coloque o nome.', true);
  const row = { nome, whatsapp:fv('cl-wa').trim() || null, documento:fv('cl-doc').trim() || null, endereco:fv('cl-end').trim() || null,
    bairro:fv('cl-bai').trim() || null, cidade:fv('cl-cid').trim() || null, observacoes:fv('cl-obs').trim() || null };
  const depois = window._cliDepois;
  const id2 = await act(async () => {
    if (cid) { const [n] = await db.upd('tdh_clientes', eqId(cid), row); Object.assign(cliente(cid), n); return cid; }
    const [n] = await db.ins('tdh_clientes', row); S.clientes.push(n); S.clientes.sort((a,b) => a.nome.localeCompare(b.nome)); return n.id;
  }, 'Salvo.');
  if (!id2) return;
  closeModal(); if (depois) depois(id2); else rerender();
}
function excluirCliente(cid){ closeModal();
  confirmar('Excluir cliente', 'Apagar este cadastro?', 'Excluir', async () => {
    const ok = await act(async () => { await db.del('tdh_clientes', eqId(cid)); S.clientes = S.clientes.filter(c => c.id !== cid); return true; });
    if (ok) go('#/clientes'); }, true); }

/* ═══════════════════════════════════════════════════════════════════
   MAIS / CONFIGURAÇÕES
   ═══════════════════════════════════════════════════════════════════ */
function vMais(){
  return `<div class="pg-head"><h2 class="pg">Mais</h2></div>
  <div class="list">${NAV2.map(([k,i,t]) => `<a class="row" href="#/${k}">${ic(i)}<div class="main"><div class="t">${t}</div></div>${ic('right')}</a>`).join('')}
    <button class="row" onclick="confirmSair()">${ic('logout')}<div class="main"><div class="t">Sair</div></div></button></div>
  <div style="text-align:center;margin-top:28px;color:var(--text3);font-size:12.5px"><img src="simbolo.svg" alt="" style="width:40px;height:40px;opacity:.9"><br>Trabalho de Homem · v${APP_VER}</div>`;
}
function confirmSair(){ confirmar('Sair', 'Sair do app neste aparelho?', 'Sair', signOut); }
function vConfig(){
  const c = S.cfg || {};
  return `
  <a class="back" href="#/mais">${ic('left')} Mais</a>
  <div class="pg-head"><div><h2 class="pg">Configurações</h2><div class="pg-sub">Padrões para os próximos orçamentos. Os já criados não mudam.</div></div></div>
  <div class="card">
    <div class="f3"><div class="field"><label>Margem material %</label><input class="in num" id="cf-marg" inputmode="decimal" value="${esc(num(c.margem_material_pct))}"></div>
      <div class="field"><label>Validade (dias)</label><input class="in num" id="cf-val" inputmode="numeric" value="${esc(c.validade_dias)}"></div>
      <div class="field"><label>Garantia (dias)</label><input class="in num" id="cf-gar" inputmode="numeric" value="${esc(c.garantia_dias)}"></div></div>
    <div class="field"><label>CNPJ</label><input class="in" id="cf-cnpj" value="${esc(c.cnpj || '')}"></div>
    <div class="f2"><div class="field"><label>Tipo de PIX</label><input class="in" id="cf-pixt" value="${esc(c.pix_tipo || '')}"></div>
      <div class="field"><label>Chave PIX</label><input class="in" id="cf-pix" value="${esc(c.pix_chave || '')}"></div></div>
    <div class="field"><label>Texto padrão — Execução</label><textarea class="in" id="cf-exe">${esc(c.texto_execucao || '')}</textarea></div>
    <div class="field"><label>Texto padrão — Garantia</label><textarea class="in" id="cf-gtx">${esc(c.texto_garantia || '')}</textarea><div class="hint">{garantia} vira o número de dias.</div></div>
    <div class="field"><label>Texto padrão — Imprevistos</label><textarea class="in" id="cf-imp">${esc(c.texto_imprevistos || '')}</textarea></div>
    <button class="btn btn-p btn-w" onclick="salvarConfig()">Salvar padrões</button>
  </div>`;
}
async function salvarConfig(){
  const row = { margem_material_pct:parseMoney(fv('cf-marg')), validade_dias:parseInt(onlyDigits(fv('cf-val')) || '15', 10), garantia_dias:parseInt(onlyDigits(fv('cf-gar')) || '90', 10),
    cnpj:fv('cf-cnpj').trim(), pix_tipo:fv('cf-pixt').trim(), pix_chave:fv('cf-pix').trim(),
    texto_execucao:fv('cf-exe').trim() || null, texto_garantia:fv('cf-gtx').trim() || null, texto_imprevistos:fv('cf-imp').trim() || null };
  await act(async () => { const [n] = await db.upd('tdh_config', 'id=eq.1', row); S.cfg = n; }, 'Padrões salvos.');
}

/* ═══ Início ═════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (sess?.access_token) start(); else $('login').classList.remove('hidden');
</script>
</body>
</html>
