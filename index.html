<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2238">
<title>Trabalho de Homem</title>
<link rel="manifest" href="manifest.json?v=4">
<!-- iOS ignora parte do manifest: sem estas linhas o "Adicionar à Tela de
     Início" abre como aba do Safari, com barra, e não como app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trab. de Homem">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Ícones com fundo azul e casinha amarela (cores invertidas em 07/11/2026):
     o amarelo se confundia com a aba do Fullfin. O simbolo.svg do cabeçalho
     e do PDF continua amarelo, porque o cabeçalho já é azul. -->
<link rel="icon" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Barlow Condensed é a fonte da logo; Barlow (mesma família, largura
     normal) fica no texto corrido para ler bem em tela pequena. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   Identidade: as cores e a fonte da logo Trabalho de Homem.
   Azul-marinho #0F2238 é a "tinta"; amarelo #F5A524 é o acento e só
   aparece em ação principal e destaque, para não virar ruído.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --navy:#0F2238; --navy2:#1B3555; --navy3:#2B4A6E;
  --yel:#F5A524; --yel-d:#D98A0B; --yel-bg:#FDF1D8;
  --bg:#F4F1EA; --card:#FFFFFF; --line:#E2DDD1; --line2:#EEEAE1;
  --text:#0F2238; --text2:#475569; --text3:#8591A2;
  --green:#2F7D4F; --green-bg:#E3F1E8;
  --red:#B23A3A;   --red-bg:#F8E4E4;
  --blue:#2E5E9E;  --blue-bg:#E5EDF8;
  --gray-bg:#ECE9E2;
  --r:14px; --tab-h:64px; --head-h:56px; --side-w:232px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
svg.ic{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}

/* ── Login ─────────────────────────────────────────────────────────── */
#login{position:fixed;inset:0;z-index:50;background:var(--navy);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;overflow:auto}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px;color:#fff}
.login-brand img{width:92px;height:92px}
.wordmark{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;line-height:.86;
  letter-spacing:1px;text-align:center}
.wordmark .l1{display:block;font-size:46px}
.wordmark .l2{display:block;font-size:46px;color:var(--yel);position:relative}
.wordmark .cwb{font-size:15px;font-weight:600;color:#D6DEE8;letter-spacing:1px;margin-left:3px}
.login-tag{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:2px;font-size:13px;white-space:nowrap;
  text-transform:uppercase;color:#D6DEE8;display:flex;align-items:center;gap:10px}
.login-tag:before,.login-tag:after{content:"";width:26px;height:2px;background:var(--yel)}
.login-box{background:var(--bg);border-radius:20px;padding:24px 22px 20px;width:100%;max-width:370px}
.login-box h1{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;margin-bottom:16px}
.login-err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}

/* ── Estrutura ─────────────────────────────────────────────────────── */
#app{min-height:100vh}
header.top{position:sticky;top:0;z-index:20;height:calc(var(--head-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px}
header.top .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;flex:1;min-width:0}
header.top .brand img{width:32px;height:32px}
header.top .brand b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px;
  text-transform:uppercase;white-space:nowrap}
header.top .brand b span{color:var(--yel)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit;display:grid;
  place-items:center;cursor:pointer;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.12)}
.icon-btn svg.ic{width:22px;height:22px}
nav.side{display:none}
main#view{padding:16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--text3);font-size:11.5px;font-weight:600}
nav.tabs a svg.ic{width:23px;height:23px}
nav.tabs a.on{color:var(--navy)}
nav.tabs a.on svg.ic{color:var(--yel-d)}
@media (min-width:900px){
  nav.tabs{display:none}
  nav.side{display:flex;flex-direction:column;gap:2px;position:fixed;top:var(--head-h);bottom:0;left:0;width:var(--side-w);
    padding:16px 12px;background:var(--card);border-right:1px solid var(--line)}
  nav.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;text-decoration:none;
    color:var(--text2);font-weight:600}
  nav.side a.on{background:var(--yel-bg);color:var(--navy)}
  nav.side .sep{height:1px;background:var(--line);margin:10px 4px}
  main#view{margin-left:var(--side-w);padding-bottom:40px;max-width:none}
  main#view>.wrap{max-width:880px;margin:0 auto}
}

/* ── Peças ─────────────────────────────────────────────────────────── */
h2.pg{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1.05;letter-spacing:.2px}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.pg-sub{color:var(--text3);font-size:13.5px;margin-top:3px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--text2);text-decoration:none;font-weight:600;
  font-size:14px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{font-family:'Barlow Condensed',sans-serif;font-size:13.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--text3);margin:22px 2px 9px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.sec .lnk{font-family:'Barlow',sans-serif;letter-spacing:0;text-transform:none;font-size:13.5px;color:var(--blue);
  font-weight:600;background:none;border:0;cursor:pointer;text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-decoration:none;display:block}
.kpi .k{font-size:12.5px;color:var(--text3);font-weight:600}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--text3);margin-top:1px}
.kpi.hi{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.hi .k,.kpi.hi .s{color:#AFC0D6}
.kpi.hi .v{color:var(--yel)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line2);
  text-decoration:none;color:inherit;cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:active{background:var(--line2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--text3);margin-top:2px;line-height:1.3}
.row .r{text-align:right;flex-shrink:0}
.row .val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700}
/* Custos e lucro previsto na lista de orçamentos. */
.row .custos{margin-top:4px}.row .custos b{font-weight:600;color:var(--text2)}
.row .luc{font-size:12.5px;font-weight:700;color:var(--green);margin-top:2px;white-space:nowrap}
.row .luc.neg{color:var(--red)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media (min-width:900px){.grid4{grid-template-columns:repeat(4,1fr)}}
@media (max-width:899px){.grid4 .kpi .v{font-size:22px}}
.kpi.ok .v{color:var(--green)}
.date-pill{width:46px;flex-shrink:0;text-align:center;background:var(--bg);border-radius:10px;padding:5px 0;line-height:1}
.date-pill b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:21px}
.date-pill span{font-size:10.5px;text-transform:uppercase;color:var(--text3);font-weight:700;letter-spacing:.5px}
.empty{padding:22px 16px;text-align:center;color:var(--text3);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;
  white-space:nowrap;letter-spacing:.2px}
.b-gray{background:var(--gray-bg);color:var(--text2)}
.b-yel{background:var(--yel-bg);color:#8A5A06}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-navy{background:var(--navy);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;
  padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.1}
.btn:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--yel);color:var(--navy)}
.btn-p:active{background:var(--yel-d)}
.btn-n{background:var(--navy);color:#fff}
.btn-s{background:var(--card);color:var(--navy);border:1.5px solid var(--line)}
.btn-g{background:transparent;color:var(--text2)}
.btn-d{background:var(--red-bg);color:var(--red)}
.btn-sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn-w{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
/* Ações do retorno: sempre numa linha só, dividindo a largura. */
.ret-acoes{display:flex;gap:6px;width:100%}
.ret-acoes .btn{flex:1;padding:8px 4px}
.fab{position:fixed;right:16px;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));z-index:15;
  border-radius:16px;padding:14px 18px;box-shadow:0 10px 24px -10px rgba(15,34,56,.55)}
@media (min-width:900px){.fab{bottom:24px;right:28px}}

/* ── COMANDO DE VOZ (igual ao Fullfin) ──
   Verde de WhatsApp: já é a cor de "mandar áudio". Fica à DIREITA, onde o
   polegar alcança (pedido do Esdras em 08/11/2026). Nas telas que têm o
   botão "+ Novo ...", sobe para ficar logo acima dele, sem cobrir. */
#fab-voz{position:fixed;right:16px;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));z-index:16;
  width:58px;height:58px;border-radius:50%;border:0;background:#25D366;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -8px rgba(37,211,102,.75);transition:transform .12s}
#fab-voz svg.ic{width:28px;height:28px}
#fab-voz:active{transform:scale(.93)}
/* Espaço no fim da página para o botão não cobrir a última linha. */
main#view{padding-bottom:calc(var(--tab-h) + 92px + env(safe-area-inset-bottom))}
#app:has(.fab) #fab-voz{bottom:calc(var(--tab-h) + 80px + env(safe-area-inset-bottom))}
@media (min-width:900px){#fab-voz{right:28px;bottom:24px} #app:has(.fab) #fab-voz{bottom:88px} main#view{padding-bottom:100px}}
/* Tela de gravação: o botão de enviar (≈3x o verde) fica EMBAIXO, perto de
   onde o polegar acabou de tocar — encerra sem mirar no meio da tela. */
#voz-overlay{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.74);display:none;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:18px;padding-bottom:calc(env(safe-area-inset-bottom) + 28px);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#voz-overlay.aberto{display:flex}
#voz-parar{width:176px;height:176px;border-radius:50%;border:0;cursor:pointer;background:#25D366;color:#fff;
  display:flex;align-items:center;justify-content:center;animation:vozPulso 1.4s ease-in-out infinite}
#voz-parar svg.ic{width:64px;height:64px}
#voz-parar:active{transform:scale(.95)}
#voz-tempo{color:#fff;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
#voz-dica{color:rgba(255,255,255,.88);font-size:15px;font-weight:600;text-align:center;padding:0 24px}
#voz-cancelar{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;
  padding:10px 26px;font-size:14px;font-weight:700;cursor:pointer}
@keyframes vozPulso{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}50%{box-shadow:0 0 0 26px rgba(37,211,102,0)}}
.voz-banner{background:var(--yel-bg);border:1px solid #F2CF8A;border-radius:11px;padding:10px 12px;margin-bottom:14px;
  font-size:13px;color:#6B4A00;line-height:1.4}
.voz-banner ul{margin:6px 0 0 16px;padding:0}
.voz-vazio{outline:2px solid var(--yel) !important;outline-offset:1px}
/* Assistente: conversa curta, a resposta mais nova embaixo. */
.as-p{align-self:flex-end;background:var(--navy);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 12px;font-size:14.5px;max-width:88%}
.as-r{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;max-width:94%}
.as-fio{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.as-itens{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.as-itens a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;color:var(--navy);font-size:13.5px;font-weight:600}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--text2)}
.field .hint{font-size:12px;color:var(--text3)}
input.in,select.in,textarea.in{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:15.5px;outline:none;min-width:0}
textarea.in{resize:vertical;min-height:70px;line-height:1.4}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--navy3)}
input.in:disabled,textarea.in:disabled,select.in:disabled{background:var(--bg);color:var(--text2)}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13.5px;
  font-weight:600;cursor:pointer;color:var(--text2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;background:var(--gray-bg);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13px;
  color:var(--text2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}

/* ── Agenda ────────────────────────────────────────────────────────── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--text3);text-align:center;padding:4px 0;text-transform:uppercase}
.cal button{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.cal button.out{opacity:.35}
@media (min-width:900px){.cal button{aspect-ratio:auto;height:66px}}
.cal button.today{border-color:var(--navy);border-width:2px}
.cal button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.cal button b{font-size:14.5px;font-weight:700}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 3px}
.dot{width:7px;height:7px;border-radius:50%}
.d-tdh{background:var(--yel)}
.d-dil{background:var(--navy3)}
.d-blq{background:var(--red)}
.cal button.sel .d-dil{background:#AFC0D6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text3);margin:10px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tag-dil{border-left:4px solid var(--navy3)}
.tag-tdh{border-left:4px solid var(--yel)}
.tag-blq{border-left:4px solid var(--red)}

/* ── Orçamento: itens ─────────────────────────────────────────────── */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.item.interno{background:#FAF8F3;border-style:dashed}
.item-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item-n{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:13px;flex-shrink:0}
.item.interno .item-n{background:var(--gray-bg);color:var(--text2)}
.item-h .sp{flex:1}
.price-box{background:var(--bg);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.price-box .in{background:var(--card);font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;
  padding:6px 10px}
.sug{font-size:12.5px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sug button{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;font-size:12.5px;padding:0}
.totbar{position:sticky;bottom:calc(var(--tab-h) + 8px + env(safe-area-inset-bottom));z-index:10;margin-top:14px;
  background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 12px 28px -14px rgba(15,34,56,.7)}
@media (min-width:900px){.totbar{bottom:14px}}
.totbar .big{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.totbar .big span{font-size:12.5px;color:#AFC0D6;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.totbar .big b{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--yel)}
.totbar .det{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin-top:6px;font-size:12px;color:#AFC0D6}
.totbar .det b{display:block;color:#fff;font-size:14px;font-weight:600}
.lock-note{display:flex;gap:9px;align-items:flex-start;background:var(--yel-bg);color:#6E4A08;border-radius:12px;
  padding:11px 13px;font-size:13.5px;margin-bottom:12px;line-height:1.35}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   Trabalho de Homem — app de serviços, orçamentos e agenda.
   Mesmo projeto Supabase do Diligências, mas só em tabelas tdh_*:
   o Diligências lê "demandas" inteira e o Fullfin importa toda demanda
   paga, então gravar lá misturaria os dois negócios.
   Estrutura do banco: previmater-ops/_sql/tdh_01_estrutura.sql
   ═══════════════════════════════════════════════════════════════════ */
const SB_URL = 'https://ggyngtqknonwnohbzkyj.supabase.co';
const SB_KEY = 'sb_publishable_WJOo1uEpdSXTPoPDlErTJw_vPSe5x1S';
// Cadastro interno "Esdras" na tabela terceiros do Diligências. É por ele
// que a agenda acha as suas diligências e os seus bloqueios.
const ESDRAS_TERC = 'bc9ada70-7a26-4320-ac78-1f9dd208a0da';
// Dados do timbrado. Ficam aqui, e não no banco, porque mudam quase nunca
// e o orçamento 653 já saiu com eles.
const EMPRESA = { nome:'Esdras de Oliveira Almeida', whats:'(41) 9 9866-5095', insta:'@trabalhodehomem.cwb',
  slogan:'Reparos, instalações e manutenção · Curitiba e região' };
const APP_VER = '1.13.0';

/* ═══ Modo invisível (Concierge) — 11/11/2026 ═════════════════════════
   O Concierge abre este app escondido (iframe, ?situacao=1) só para montar
   o mesmo resumo do assistente (vozSituacao) e responder pergunta falada
   sem abrir o app. Nesse modo o app NÃO usa nem renova o login guardado
   (tdh_sess): usa só o passe que o Concierge manda, em memória. Motivo:
   renovar a mesma chave em dois lugares faz o Supabase derrubar a sessão,
   e o app aberto de verdade cairia. Também não desenha tela, não sai da
   conta e não grava nada. */
const MODO_SIT = (() => { try { return window.parent !== window && new URLSearchParams(location.search).get('situacao') === '1'; } catch(e) { return false; } })();

/* ═══ Cliente Supabase ═══════════════════════════════════════════════
   Escrito à parte, e não copiado do Diligências, porque o de lá aceita
   um filtro só por consulta, grava só a primeira linha de um lote e não
   renova o login: depois de 1 hora a sessão cai e pede senha de novo. */
let sess = null;
if (!MODO_SIT) { try { sess = JSON.parse(localStorage.getItem('tdh_sess') || 'null'); } catch(e) { sess = null; } }

// No modo invisível a sessão fica só em memória (ver MODO_SIT).
function saveSess(s){ sess = s; if (MODO_SIT) return; try { s ? localStorage.setItem('tdh_sess', JSON.stringify(s)) : localStorage.removeItem('tdh_sess'); } catch(e){} }

let refreshing = null;
async function refreshSess(){
  if (!sess?.refresh_token) throw new Error('sem sessão');
  // Uma renovação por vez: várias consultas em paralelo com token vencido
  // pediriam várias renovações, e só a primeira vale.
  if (!refreshing) refreshing = (async () => {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'Content-Type':'application/json', apikey:SB_KEY},
      body: JSON.stringify({ refresh_token: sess.refresh_token })
    });
    const d = await r.json().catch(() => ({}));
    // Só 400/401/403 é recusa de verdade (saiu da conta, senha trocada).
    // Servidor ocupado (429/5xx) ou sem internet NÃO pode apagar o login:
    // antes, abrir o app sem sinal derrubava a sessão e pedia senha.
    if (!r.ok) {
      if (r.status === 400 || r.status === 401 || r.status === 403) { saveSess(null); throw new Error('Sessão expirada. Entre de novo.'); }
      throw new Error('Sem conexão com o servidor. Tente de novo.');
    }
    if (!d.expires_at) d.expires_at = Math.floor(Date.now()/1000) + (d.expires_in || 3600);
    saveSess(d);
  })().finally(() => { refreshing = null; });
  return refreshing;
}

async function api(path, opt = {}, retry = true){
  // Falha na renovação só leva ao login se a sessão foi de fato recusada
  // (refreshSess apaga sess nesse caso). Sem internet, só avisa o erro.
  if (sess?.expires_at && sess.expires_at - 60 < Date.now()/1000) { try { await refreshSess(); } catch(e) { if (!sess) onSignedOut(); throw e; } }
  const h = { apikey:SB_KEY, 'Content-Type':'application/json', ...(opt.headers || {}) };
  h.Authorization = 'Bearer ' + (sess?.access_token || SB_KEY);
  const r = await fetch(SB_URL + path, { ...opt, headers:h });
  if (r.status === 401 && retry && sess?.refresh_token) {
    try { await refreshSess(); } catch(e) { if (!sess) onSignedOut(); throw e; }
    return api(path, opt, false);
  }
  const txt = await r.text();
  let d = null; try { d = txt ? JSON.parse(txt) : null; } catch(e) { d = txt; }
  if (!r.ok) throw new Error((d && (d.message || d.msg || d.error_description || d.hint)) || ('Erro ' + r.status));
  return d;
}
const db = {
  sel: (t, qs = '') => api(`/rest/v1/${t}?select=*${qs}`),
  // Só as colunas pedidas: usado nas tabelas do Diligências, para não
  // trazer ao celular dado de contratante que este app não usa.
  cols: (t, cols, qs = '') => api(`/rest/v1/${t}?select=${cols}${qs}`),
  // Aceita objeto ou lista: lote vai num POST só, tudo ou nada.
  ins: (t, rows) => api(`/rest/v1/${t}`, { method:'POST', headers:{Prefer:'return=representation'}, body:JSON.stringify(rows) }),
  upd: (t, filt, obj) => api(`/rest/v1/${t}?${filt}`, { method:'PATCH', headers:{Prefer:'return=representation'}, body:JSON.stringify(obj) }),
  del: (t, filt) => api(`/rest/v1/${t}?${filt}`, { method:'DELETE' }),
  rpc: (fn, args) => api(`/rest/v1/rpc/${fn}`, { method:'POST', body:JSON.stringify(args || {}) }),
};
const eqId = id => 'id=eq.' + encodeURIComponent(id);

/* ═══ Utilidades ═════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const money = v => BRL.format(num(v));
const m$ = v => `<span class="money">${money(v)}</span>`;
// Aceita "1.234,56", "1234,56", "1234.56" e "R$ 50". Vírgula manda: com
// vírgula, ponto é milhar; sem vírgula, ponto é decimal.
function parseMoney(s){
  s = String(s ?? '').replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? Math.round(n*100)/100 : 0;
}
const moneyIn = v => num(v) ? num(v).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : '';
// Campo de dinheiro com máscara, igual ao Fullfin e às Diligências: digita
// só números e eles entram pelos centavos (2500 → 25,00). Ninguém digita
// vírgula. Vale para todo <input data-money>, inclusive os criados depois
// (escuta no document). Em captura, roda antes dos oninput dos campos, que
// assim já leem o valor formatado. O valor continua sendo lido por
// parseMoney, que entende "1.234,56".
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.matches || !el.matches('input[data-money]')) return;
  const dig = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 12);
  el.value = dig ? (parseInt(dig, 10) / 100).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : '';
  requestAnimationFrame(() => { try { el.setSelectionRange(el.value.length, el.value.length); } catch(_) {} });
}, true);
// Cursor sempre no fim: a máscara só acrescenta e apaga pela direita, então
// cursor no começo fazia o apagar não funcionar.
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.matches && el.matches('input[data-money]'))
    requestAnimationFrame(() => { try { el.setSelectionRange(el.value.length, el.value.length); } catch(_) {} });
});
// Tempo: "1h30", "1:30", "90" (minutos), "2h", "1,5h".
function parseTempo(s){
  s = String(s ?? '').trim().toLowerCase().replace(/\s/g, '');
  if (!s) return null;
  let m;
  if ((m = s.match(/^(\d+)[:h](\d{1,2})m?(in)?$/))) return +m[1]*60 + +m[2];
  if ((m = s.match(/^(\d+(?:[.,]\d+)?)h$/))) return Math.round(parseFloat(m[1].replace(',', '.'))*60);
  if ((m = s.match(/^(\d+)(m|min)?$/))) return +m[1];
  return null;
}
function fmtTempo(min){
  min = num(min); if (!min) return '';
  const h = Math.floor(min/60), m = min % 60;
  return h ? (m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`) : `${m}min`;
}
// Datas sempre em ISO local (AAAA-MM-DD). toISOString() daria a data em
// UTC, e depois das 21h em Curitiba isso já é o dia seguinte.
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const hoje = () => iso(new Date());
const parseISO = s => { const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const addDias = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtData = s => s ? String(s).slice(0,10).split('-').reverse().join('/') : '';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const hhmm = t => t ? String(t).slice(0,5) : '';
const toMin = t => { if (!t) return null; const [h,m] = String(t).split(':').map(Number); return h*60 + (m||0); };
const onlyDigits = s => String(s ?? '').replace(/\D/g, '');
function waLink(phone, text){
  let d = onlyDigits(phone); if (!d) return null;
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');
}
const mapsLink = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const uniq = a => [...new Set(a)];

function toast(msg, err){
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : '';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), err ? 4500 : 2400);
}

/* ═══ Regras de dinheiro ═════════════════════════════════════════════ */
// Preço sugerido = material com margem + mão de obra, arredondado de 5 em 5.
// É a conta que fechou o orçamento 653, linha a linha (215, 570, 135...).
function sugerido(it){
  const v = num(it.material_custo) * (1 + num(it.margem_material_pct)/100) + num(it.mao_obra);
  return Math.round(v/5)*5;
}
// Custo interno (ajudante, alimentação) não vai para o cliente: conta pelo
// que você paga, material + mão de obra da linha.
function totaisOrc(oid){
  const its = itensDe(oid);
  const sv = its.filter(i => i.tipo === 'servico'), ci = its.filter(i => i.tipo === 'custo_interno');
  const total = sv.reduce((s,i) => s + num(i.preco_cliente), 0);
  const material = sv.reduce((s,i) => s + num(i.material_custo), 0);
  const interno = ci.reduce((s,i) => s + num(i.material_custo) + num(i.mao_obra), 0);
  const tempo = sv.reduce((s,i) => s + num(i.tempo_estimado_min), 0);
  const lucro = total - material - interno;
  return { total, material, interno, tempo, lucro, nServ:sv.length, porHora: tempo ? lucro/(tempo/60) : null };
}
// Opções da mesma obra (o cliente escolhe uma). alternativa_de sempre
// aponta para o principal do grupo, então o grupo é alternativa_de || id.
const grupoOrc = o => o.alternativa_de || o.id;
const altsDe = o => S.orcs.filter(x => x.id !== o.id && grupoOrc(x) === grupoOrc(o));
// Soma da tela de Orçamentos. Duas regras:
// - recusado e cancelado não entram nem na aba "Todos": é dinheiro que não
//   vem, e somar deixaria o número sem uso;
// - de cada grupo de opções conta só a de maior valor. Somar as opções
//   contaria a mesma obra duas vezes.
function resumoOrcs(lista){
  const vale = lista.filter(o => o.status !== 'recusado' && o.status !== 'cancelado');
  const melhor = new Map();
  for (const o of vale) { const t = totaisOrc(o.id), g = grupoOrc(o), m = melhor.get(g);
    if (!m || t.total > m.t.total) melhor.set(g, { o, t }); }
  const r = { total:0, material:0, interno:0, lucro:0, n:vale.length, obras:melhor.size };
  for (const { t } of melhor.values()) { r.total += t.total; r.material += t.material; r.interno += t.interno; r.lucro += t.lucro; }
  return r;
}
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
function totaisServ(sid){
  const s = serv(sid); const vs = vincDe(sid), rs = recebDe(sid);
  const repasse = vs.reduce((t,v) => t + num(v.valor_repasse), 0);
  const repPago = vs.filter(v => v.repasse_status === 'pago').reduce((t,v) => t + num(v.valor_repasse), 0);
  const lancado = rs.reduce((t,r) => t + num(r.valor), 0);
  const recebido = rs.filter(r => r.recebido_em).reduce((t,r) => t + num(r.valor), 0);
  // Gasto real lançado substitui o material previsto. Enquanto não houver
  // nenhum, vale a previsão: serviço recém-aprovado não pode aparecer com
  // lucro de 100% só porque a compra ainda não foi feita.
  // Material devolvido com crédito na loja baixa o gasto desta obra (mesma
  // conta do tdh_finalizar_servico). O crédito em si fica na loja.
  const devol = S.creditos.filter(c => c.servico_id === sid).reduce((t,c) => t + num(c.valor), 0);
  const gs = gastosDe(sid), gastoBruto = gs.reduce((t,g) => t + num(g.valor), 0), gastoReal = gastoBruto - devol, temGasto = gs.length > 0;
  // Imprevisto = compra que não estava no escopo orçado (marcada pelo
  // Esdras na voz ou na chave do gasto). Já está dentro de gastoReal: aqui
  // só se separa para mostrar quanto do lucro foi embora com imprevisto.
  const gastoImprev = gs.filter(g => g.imprevisto).reduce((t,g) => t + num(g.valor), 0);
  const previsto = num(s?.custo_material);
  const lucroPrev = num(s?.valor_cobrado) - previsto - repasse;
  // Finalizado: vale o lucro guardado na finalização, que é o que foi
  // para o Fullfin (recebido − gastos − repasses).
  const lucro = s?.finalizado_em ? num(s.lucro_final) : num(s?.valor_cobrado) - (temGasto ? gastoReal : previsto) - repasse;
  return { repasse, repPago, lancado, recebido, aReceber: lancado - recebido, lucro, lucroPrev, previsto, gastoReal, gastoBruto, devol, gastoImprev, temGasto };
}

$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('l-btn'), err = $('login-err'); err.classList.add('hidden'); btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{'Content-Type':'application/json', apikey:SB_KEY},
      body: JSON.stringify({ email:$('l-email').value.trim(), password:$('l-pass').value })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error_code === 'invalid_credentials' || d.error === 'invalid_grant' ? 'E-mail ou senha incorretos.' : (d.msg || d.error_description || 'Não foi possível entrar.'));
    if (!d.expires_at) d.expires_at = Math.floor(Date.now()/1000) + (d.expires_in || 3600);
    saveSess(d);
    await start();
  } catch(ex) { err.textContent = ex.message; err.classList.remove('hidden'); }
  finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});

async function start(){
  loading(true);
  try {
    // O acesso é fechado no banco para um login só (função is_tdh). Para
    // qualquer outro, as tabelas voltam vazias em vez de dar erro, então a
    // config vazia é o sinal de "este login não tem acesso".
    const cfg = await loadCfg();
    if (!cfg) { await signOut(); const err = $('login-err');
      err.textContent = 'Este login não tem acesso ao Trabalho de Homem.'; err.classList.remove('hidden'); return; }
    await Promise.all([load(...Object.keys(TAB)), loadDiligencias(), loadCarteiras()]);
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    buildNav();
    if (!location.hash || location.hash === '#') location.replace('#/painel'); else render();
    // Atalho "Lançar por voz": só depois da carga, senão a resposta da
    // voz chegaria sem as obras e clientes para abrir a tela certa.
    setTimeout(vozAtalho, 0);
  } catch(e) {
    console.error(e);
    if (!sess) onSignedOut(); else toast(e.message || 'Falha ao carregar.', true);
  } finally { loading(false); }
}
async function signOut(){

function route(){

function confirmar(title, msg, okLabel, onOk, danger){

    <button class="btn btn-g" onclick="closeModal()">Voltar</button></div>`);
  $('cf-ok').onclick = async () => { closeModal(); await onOk(); };
}

/* ═══════════════════════════════════════════════════════════════════
   PAINEL
   ═══════════════════════════════════════════════════════════════════ */
function vPainel(){
  const h = hoje(), mes = h.slice(0,7);
  const pend = S.receb.filter(r => !r.recebido_em && servAtivo(r.servico_id));
  const atras = pend.filter(r => r.previsao && r.previsao < h);
  const aReceber = pend.reduce((t,r) => t + num(r.valor), 0);
  const repPend = S.vinc.filter(v => v.repasse_status !== 'pago' && servAtivo(v.servico_id));
  const repTot = repPend.reduce((t,v) => t + num(v.valor_repasse), 0);
  const abertos = S.orcs.filter(o => o.status === 'enviado');
  const abertosTot = abertos.reduce((t,o) => t + totaisOrc(o.id).total, 0);
  const recMes = S.receb.filter(r => (r.recebido_em||'').startsWith(mes)).reduce((t,r) => t + num(r.valor), 0);
  const repMes = S.vinc.filter(v => (v.repassado_em||'').startsWith(mes)).reduce((t,v) => t + num(v.valor_repasse), 0);
  const prox = S.agendas.filter(a => a.data >= h && a.data <= addDias(h, 7) && agAtiva(a));
  const dil7 = S.dil.filter(d => d.data >= h && d.data <= addDias(h, 7));
  const saud = new Date().getHours() < 12 ? 'Bom dia' : new Date().getHours() < 18 ? 'Boa tarde' : 'Boa noite';
  const linhas = [...prox.map(a => ({ k:'tdh', data:a.data, ini:a.horario_inicio, a })), ...dil7.map(d => ({ k:'dil', data:d.data, ini:d.horario, d }))]
    .sort((x,y) => (x.data + (x.ini||'')).localeCompare(y.data + (y.ini||'')));
  return `
  <div class="pg-head"><div><h2 class="pg">${saud}, Esdras</h2><div class="pg-sub">${fmtDataLonga(h)}</div></div></div>
  ${painelRetornos()}
  <div class="grid2">
    <a class="kpi hi" href="#/servicos"><div class="k">A receber</div><div class="v">${m$(aReceber)}</div>
      <div class="s">${pend.length} lançamento(s)${atras.length ? ` · <b style="color:#FFB4B4">${atras.length} atrasado(s)</b>` : ''}</div></a>
    <a class="kpi" href="#/servicos"><div class="k">Repasses a pagar</div><div class="v">${m$(repTot)}</div><div class="s">${repPend.length} prestador(es)</div></a>
    <a class="kpi" href="#/orcamentos"><div class="k">Orçamentos em aberto</div><div class="v">${m$(abertosTot)}</div><div class="s">${abertos.length} aguardando resposta</div></a>
    <div class="kpi"><div class="k">Recebido em ${MESES[+mes.slice(5)-1]}</div><div class="v">${m$(recMes)}</div><div class="s">repassado ${m$(repMes)}</div></div>
  </div>
  <div class="btns" style="margin-top:12px">
    <button class="btn btn-p" style="flex:1" onclick="novoOrcamento()">${ic('plus')} Orçamento</button>
    <button class="btn btn-s" style="flex:1" onclick="modalNovoServico()">${ic('plus')} Serviço direto</button>
    <button class="btn btn-s" style="flex:1" onclick="modalGasto({})">${ic('plus')} Gasto</button>
  </div>
  ${servAFinalizar().length ? `<a class="warn" style="margin-top:10px;text-decoration:none" href="#/servicos">${ic('alert')}<span><b>${servAFinalizar().length}</b> serviço(s) executado(s) esperando finalizar. O lucro só vai para o Fullfin depois disso.</span></a>` : ''}
  ${totPendPF() ? `<a class="warn" style="margin-top:10px;text-decoration:none" href="#/financeiro">${ic('alert')}<span><b>${totPendPF()}</b> lançamento(s) passaram pela sua conta PF e falta acertar.</span></a>` : ''}
  <div class="sec">Próximos 7 dias <a class="lnk" href="#/agenda">Agenda</a></div>
  <div class="list">${linhas.length ? linhas.map(rowAgendaMista).join('') : '<div class="empty">Nada marcado nos próximos 7 dias.</div>'}</div>
  ${atras.length ? `<div class="sec">Recebimentos atrasados</div><div class="list">${atras.map(r => { const s = serv(r.servico_id);
    return `<a class="row" href="#/serv/${s.id}"><div class="main"><div class="t">${esc(s.descricao)}</div>
      <div class="m">${esc(r.descricao)} · previsto ${fmtData(r.previsao)}</div></div><div class="r val" style="color:var(--red)">${m$(r.valor)}</div></a>`; }).join('')}</div>` : ''}

function fmtDataLonga(s){ const d = parseISO(s); return `${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; }
function datePill(s){ const d = parseISO(s); return `<div class="date-pill"><b>${d.getDate()}</b><span>${DSEM[d.getDay()]}</span></div>`; }
function rowAgendaMista(x){
  if (x.k === 'tdh') { const a = x.a, s = serv(a.servico_id), c = cliente(s?.cliente_id);
    return `<a class="row tag-tdh" href="#/serv/${s.id}">${datePill(a.data)}<div class="main"><div class="t">${esc(s.descricao)}</div>

    <div class="m">${d.horario ? hhmm(d.horario) : 'Sem horário'}${d.local ? ' · ' + esc(d.local) : ''}</div></div><span class="badge b-navy">Diligência</span></div>`;
}
const horaFaixa = a => a.horario_inicio ? hhmm(a.horario_inicio) + (a.horario_fim ? '–' + hhmm(a.horario_fim) : '') : 'Dia inteiro';

/* ═══════════════════════════════════════════════════════════════════
   AGENDA
   ═══════════════════════════════════════════════════════════════════ */
let calMes = null, calSel = null;
function vAgenda(r){
  if (r.id && /^\d{4}-\d{2}$/.test(r.id)) calMes = r.id;
  if (!calMes) calMes = hoje().slice(0,7);
  if (!calSel || !calSel.startsWith(calMes)) calSel = calMes === hoje().slice(0,7) ? hoje() : calMes + '-01';
  const [y, m] = calMes.split('-').map(Number);
  const first = new Date(y, m-1, 1), startDow = first.getDay(), dias = new Date(y, m, 0).getDate();
  const ext = blqExternos();
  const porDia = {};
  const add = (d, k) => { (porDia[d] = porDia[d] || new Set()).add(k); };
  S.agendas.forEach(a => { if (agAtiva(a)) add(a.data, 'tdh'); });
  S.dil.forEach(d => add(d.data, 'dil')); ext.forEach(b => add(String(b.data).slice(0,10), 'blq'));
  let cells = DSEM.map(d => `<div class="wd">${d}</div>`).join('');
  const total = Math.ceil((startDow + dias)/7)*7;
  for (let i = 0; i < total; i++) {
    const d = new Date(y, m-1, 1 - startDow + i), ds = iso(d), out = d.getMonth() !== m-1;
    const k = porDia[ds] || new Set();
    cells += `<button class="${out ? 'out ' : ''}${ds === hoje() ? 'today ' : ''}${ds === calSel ? 'sel' : ''}" onclick="calPick('${ds}')">
      <b>${d.getDate()}</b><span class="dots">${k.has('tdh') ? '<i class="dot d-tdh"></i>' : ''}${k.has('dil') ? '<i class="dot d-dil"></i>' : ''}${k.has('blq') ? '<i class="dot d-blq"></i>' : ''}</span></button>`;
  }
  const prev = iso(new Date(y, m-2, 1)).slice(0,7), next = iso(new Date(y, m, 1)).slice(0,7);
  return `
  <div class="pg-head"><h2 class="pg">Agenda</h2>
    <button class="btn btn-sm btn-s" onclick="calHoje()">Hoje</button></div>
  <div class="card">
    <div class="cal-nav"><button class="icon-btn" onclick="go('#/agenda/${prev}')">${ic('left')}</button>
      <h3>${MESES[m-1]} ${y}</h3><button class="icon-btn" onclick="go('#/agenda/${next}')">${ic('right')}</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i class="dot d-tdh"></i>Trabalho de Homem</span><span><i class="dot d-dil"></i>Suas diligências</span><span><i class="dot d-blq"></i>Bloqueio</span></div>
  </div>
  <div id="cal-dia">${diaHtml(calSel)}</div>`;
}
function calPick(ds){
  if (!ds.startsWith(calMes)) { calSel = ds; go('#/agenda/' + ds.slice(0,7)); return; }
  calSel = ds;
  document.querySelectorAll('.cal button').forEach(b => b.classList.remove('sel'));
  const btn = [...document.querySelectorAll('.cal button')].find(b => b.getAttribute('onclick') === `calPick('${ds}')`);
  if (btn) btn.classList.add('sel');
  $('cal-dia').innerHTML = diaHtml(ds);
}
function calHoje(){ calSel = hoje(); go('#/agenda/' + hoje().slice(0,7)); }
function diaHtml(ds){
  const ag = S.agendas.filter(a => a.data === ds && agAtiva(a));
  const dl = S.dil.filter(d => d.data === ds), bl = blqExternos().filter(b => String(b.data).slice(0,10) === ds);
  const itens = [
    ...ag.map(a => ({ t:a.horario_inicio || '', h:() => { const s = serv(a.servico_id), c = cliente(s.cliente_id);
      return `<a class="row tag-tdh" href="#/serv/${s.id}"><div class="main"><div class="t">${esc(s.descricao)}</div>
      <div class="m">${horaFaixa(a)}${c ? ' · ' + esc(nomeC(c)) : ''}${s.endereco ? ' · ' + esc(s.endereco) : ''}</div></div>${badgeServ(s)}</a>`; } })),
    ...dl.map(d => ({ t:d.horario || '', h:() => `<div class="row tag-dil" style="cursor:default"><div class="main"><div class="t">${esc(d.descricao || 'Diligência')}</div>
      <div class="m">${d.horario ? hhmm(d.horario) : 'Sem horário'}${d.local ? ' · ' + esc(d.local) : ''}</div></div><span class="badge b-navy">Diligência</span></div>` })),
    ...bl.map(b => ({ t:b.horario_inicio || '', h:() => `<div class="row tag-blq" style="cursor:default"><div class="main"><div class="t">${esc(b.motivo || 'Bloqueio')}</div>
      <div class="m">${b.horario_inicio ? hhmm(b.horario_inicio) + '–' + hhmm(b.horario_fim) : 'Dia inteiro'}</div></div><span class="badge b-red">Bloqueio</span></div>` })),
  ].sort((a,b) => String(a.t).localeCompare(String(b.t)));
  return `<div class="sec">${fmtDataLonga(ds)}<button class="lnk" onclick="modalNovoServico('${ds}')">+ Serviço neste dia</button></div>
    <div class="list">${itens.length ? itens.map(i => i.h()).join('') : '<div class="empty">Dia livre.</div>'}</div>`;
}

/* Conflitos: outros serviços no mesmo horário, suas diligências do dia e
   bloqueios seus. Só avisa, não impede: quem decide é você. */
function conflitos(data, ini, fim, ignorarAgendaId){
  const av = [];
  const i0 = toMin(ini), f0 = toMin(fim) ?? (i0 != null ? i0 + 60 : null);
  const sobrepoe = (a1, b1, a2, b2) => a1 == null || a2 == null ? true : a1 < b2 && a2 < b1;
  S.agendas.filter(a => a.data === data && a.id !== ignorarAgendaId && agAtiva(a)).forEach(a => {
    const ai = toMin(a.horario_inicio), af = toMin(a.horario_fim) ?? (ai != null ? ai + 60 : null);
    if (sobrepoe(i0, f0, ai, af)) av.push(`Já tem <b>${esc(serv(a.servico_id).descricao)}</b> ${a.horario_inicio ? 'das ' + horaFaixa(a) : 'o dia inteiro'}.`);
  });
  S.dil.filter(d => d.data === data).forEach(d => {
    av.push(`Você tem a diligência <b>${esc(d.descricao || '')}</b> ${d.horario ? 'às ' + hhmm(d.horario) : 'neste dia (sem horário)'}.`);
  });
  blqExternos().filter(b => String(b.data).slice(0,10) === data).forEach(b => {
    const bi = toMin(b.horario_inicio), bf = toMin(b.horario_fim);
    if (sobrepoe(i0, f0, bi, bf)) av.push(`Bloqueio na agenda: <b>${esc(b.motivo || 'indisponível')}</b> ${b.horario_inicio ? hhmm(b.horario_inicio) + '–' + hhmm(b.horario_fim) : '(dia inteiro)'}.`);
  });
  return av;
}

// Só informativo: o número real sai da sequence do banco na emissão.
function proxNumero(){ const n = S.orcs.map(o => num(o.numero)).filter(Boolean); return (n.length ? Math.max(...n) + 1 : 654) + '/' + new Date().getFullYear(); }

let abrirItemAoEntrar = null;
async function novoOrcamento(cid){
  const c = S.cfg || {}, cl = cid ? cliente(cid) : null;
  const o = await act(async () => {
    const [novo] = await db.ins('tdh_orcamentos', {
      status:'rascunho', validade_dias:c.validade_dias ?? 15, garantia_dias:c.garantia_dias ?? 90,
      cliente_id:cl?.id || null, cliente_nome:cl?.nome || null,
      local_servico:cl ? [cl.endereco, cl.bairro, cl.cidade].filter(Boolean).join(', ') || null : null,

function bindOrcInputs(o){
  const view = $('view');
  view.querySelectorAll('[data-o]').forEach(el => {
    el.addEventListener('change', () => salvarCampoOrc(o.id, el));
  });
  view.querySelectorAll('[data-item]').forEach(box => {
    const it = S.itens.find(i => i.id === box.dataset.item); if (!it) return;
    box.querySelectorAll('[data-i]').forEach(el => {
      el.addEventListener('input', () => itemInput(it, el, box));
      el.addEventListener('change', () => itemChange(it, el, box));
    });
  });
}
function lerCampo(el){
  const k = el.dataset.kind;
  if (k === 'money') return parseMoney(el.value);
  if (k === 'int') return Math.max(0, parseInt(onlyDigits(el.value) || '0', 10));
  if (k === 'pct') return parseMoney(el.value);
  if (k === 'tempo') return parseTempo(el.value);
  return el.value.trim() || null;
}
async function salvarCampoOrc(oid, el){
  const o = orc(oid), f = el.dataset.o, v = lerCampo(el);
  if (f === 'entrada_valor') el.value = moneyIn(v);
  o[f] = v;
  if (f === 'entrada_valor' || f === 'validade_dias') pintaTotais(oid);
  try { await db.upd('tdh_orcamentos', eqId(oid), { [f]: v }); } catch(e) { toast('Não salvou: ' + e.message, true); }
}
// Enquanto digita: recalcula preço sugerido e totais na tela, sem gravar.
// Se o preço estava igual ao sugerido, ele acompanha; se você digitou um
// preço próprio, ele fica parado.
function itemInput(it, el, box){
  const f = el.dataset.i;
  if (f === 'titulo' || f === 'descricao_cliente') return;
  if (f === 'tempo_estimado_min') { it.tempo_estimado_min = parseTempo(el.value); pintaTotais(it.orcamento_id); return; }
  const antes = sugerido(it), acompanhava = num(it.preco_cliente) === antes;
  it[f] = lerCampo(el);
  if (it.tipo === 'servico' && f !== 'preco_cliente' && acompanhava) {
    it.preco_cliente = sugerido(it);
    const pi = box.querySelector('[data-i="preco_cliente"]'); if (pi) pi.value = moneyIn(it.preco_cliente);
  }
  const sg = box.querySelector('[data-sug]'); if (sg) sg.innerHTML = sugHtml(it);
  pintaTotais(it.orcamento_id);
}
async function itemChange(it, el, box){
  const f = el.dataset.i;
  const patch = {};
  if (f === 'titulo') { if (!el.value.trim()) { el.value = it.titulo; return; } patch.titulo = it.titulo = el.value.trim(); }
  else if (f === 'descricao_cliente') patch.descricao_cliente = it.descricao_cliente = el.value.trim() || null;
  else if (f === 'tempo_estimado_min') { patch.tempo_estimado_min = it.tempo_estimado_min = parseTempo(el.value); el.value = fmtTempo(it.tempo_estimado_min); }
  else { patch[f] = it[f] = lerCampo(el); if (el.dataset.kind === 'money') el.value = moneyIn(it[f]);
    // O preço pode ter acompanhado a mudança: grava junto.
    if (it.tipo === 'servico' && f !== 'preco_cliente') patch.preco_cliente = num(it.preco_cliente); }
  try { await db.upd('tdh_orcamento_itens', eqId(it.id), patch); } catch(e) { toast('Não salvou: ' + e.message, true); }
}
async function usarSugerido(iid){
  const it = S.itens.find(i => i.id === iid); it.preco_cliente = sugerido(it);
  await act(() => db.upd('tdh_orcamento_itens', eqId(iid), { preco_cliente: it.preco_cliente }));

async function setEntrada(oid, v){ const o = orc(oid); o.entrada_valor = v;

// "Opção de outro orçamento": só lista orçamentos do mesmo cliente que
// ainda não estão no grupo deste. Quem já está no grupo aparece na dica.
function campoAlternativa(o, ed){
  const mesmoCli = x => o.cliente_id ? x.cliente_id === o.cliente_id : (!!o.cliente_nome && x.cliente_nome === o.cliente_nome);
  const alts = altsDe(o);
  const cand = S.orcs.filter(x => x.id !== o.id && grupoOrc(x) !== grupoOrc(o) && mesmoCli(x)
    && x.status !== 'recusado' && x.status !== 'cancelado');
  if (!alts.length && !cand.length) return '';
  const dis = ed ? '' : 'disabled';
  return `<div class="field"><label>É opção de outro orçamento?</label>
    <select class="in" ${dis} onchange="orcSetAlt('${o.id}', this.value)">
      <option value="">Não, é uma obra separada</option>
      ${alts.length ? `<option value="__manter" selected>Sim, junto com Nº ${alts.map(numOrc).join(', ')}</option>` : ''}
      ${cand.map(x => `<option value="${x.id}">Sim, opção do Nº ${numOrc(x)} (${money(totaisOrc(x.id).total)})</option>`).join('')}
    </select>
    ${alts.length ? `<div class="hint">O cliente escolhe uma entre este e ${alts.map(x => 'Nº ' + numOrc(x)).join(', ')}. Na soma conta só a de maior valor; ao aprovar uma, as outras viram recusadas.</div>` : ''}</div>`;
}
async function orcSetAlt(oid, val){
  if (val === '__manter') return;
  const o = orc(oid);
  await act(async () => {
    if (!val) {
      // Sair do grupo. Se este era o principal, o próximo assume o papel,
      // para as opções que sobram continuarem juntas.
      const filhos = S.orcs.filter(x => x.alternativa_de === o.id);
      if (filhos.length) {
        const novo = filhos[0];
        await db.upd('tdh_orcamentos', eqId(novo.id), { alternativa_de:null }); novo.alternativa_de = null;
        if (filhos.length > 1) {
          await db.upd('tdh_orcamentos', 'alternativa_de=eq.' + encodeURIComponent(o.id), { alternativa_de:novo.id });
          filhos.slice(1).forEach(x => x.alternativa_de = novo.id);
        }
      }
      const [n] = await db.upd('tdh_orcamentos', eqId(oid), { alternativa_de:null }); Object.assign(o, n);
      return;
    }
    // Entrar no grupo do escolhido. Sempre aponta para o principal (nunca
    // para outra opção) e leva junto quem apontava para este: assim o grupo
    // é sempre "alternativa_de || id", sem cadeia.
    const raiz = grupoOrc(orc(val));
    if (S.orcs.some(x => x.alternativa_de === o.id)) {
      await db.upd('tdh_orcamentos', 'alternativa_de=eq.' + encodeURIComponent(o.id), { alternativa_de:raiz });
      S.orcs.filter(x => x.alternativa_de === o.id).forEach(x => x.alternativa_de = raiz);
    }
    const [n] = await db.upd('tdh_orcamentos', eqId(oid), { alternativa_de:raiz }); Object.assign(o, n);
  });
  rerender();
}
async function orcSetCliente(oid, cid){
  const o = orc(oid), c = cliente(cid);
  const patch = { cliente_id: cid || null, cliente_nome: c?.nome || null };
  // O endereço do cliente entra como local só se o campo estava vazio.
  if (c?.endereco && !o.local_servico) patch.local_servico = [c.endereco, c.bairro, c.cidade].filter(Boolean).join(', ');
  await act(async () => { const [n] = await db.upd('tdh_orcamentos', eqId(oid), patch); Object.assign(o, n); });
  rerender();
}

async function criarItem(oid, tipo){

  const its = itensDe(oid);
  const row = { orcamento_id:oid, tipo, titulo:tit, ordem:(its.length ? Math.max(...its.map(i => i.ordem)) : 0) + 1,
    material_custo:parseMoney(fv('ni-mat')), mao_obra:parseMoney(fv('ni-mo')) };
  if (tipo === 'servico') {
    row.descricao_cliente = fv('ni-desc').trim() || null; row.tempo_estimado_min = parseTempo(fv('ni-tempo'));
    row.margem_material_pct = parseMoney(fv('ni-marg')); row.preco_cliente = sugerido(row);
  } else { row.margem_material_pct = 0; row.preco_cliente = 0; }
  const ok = await act(async () => { const [n] = await db.ins('tdh_orcamento_itens', row); S.itens.push(n); return true; });

async function moveItem(iid, dir){
  const it = S.itens.find(i => i.id === iid), its = itensDe(it.orcamento_id), k = its.indexOf(it), o = its[k + dir];
  if (!o) return;
  const a = it.ordem, b = o.ordem === a ? a + dir : o.ordem;
  it.ordem = b; o.ordem = a;
  await act(() => Promise.all([db.upd('tdh_orcamento_itens', eqId(it.id), { ordem:b }), db.upd('tdh_orcamento_itens', eqId(o.id), { ordem:a })]));
  rerender();
}

}

// pre: resposta do comando de voz (mostra o que foi ouvido acima do texto).
function aprovarOrc(oid, pre){

    'Criar serviço', async () => {
      const sid = await act(async () => {

        return id;
      }, 'Serviço criado.');
      if (sid) go('#/serv/' + sid);
    });
}
async function duplicarOrc(oid){
  const o = orc(oid), its = itensDe(oid);
  const novo = await act(async () => {
    const campos = ['cliente_id','cliente_nome','local_servico','subtitulo','validade_dias','garantia_dias','entrada_valor','texto_execucao','texto_garantia','texto_imprevistos'];
    const row = { status:'rascunho' }; campos.forEach(k => row[k] = o[k]);
    const [n] = await db.ins('tdh_orcamentos', row);
    if (its.length) {
      const cps = its.map(i => ({ orcamento_id:n.id, ordem:i.ordem, tipo:i.tipo, titulo:i.titulo, descricao_cliente:i.descricao_cliente,
        tempo_estimado_min:i.tempo_estimado_min, material_custo:i.material_custo, mao_obra:i.mao_obra, margem_material_pct:i.margem_material_pct, preco_cliente:i.preco_cliente }));
      S.itens.push(...await db.ins('tdh_orcamento_itens', cps));
    }
    S.orcs.unshift(n); return n;
  }, 'Cópia criada como rascunho.');
  if (novo) go('#/orc/' + novo.id);
}
function excluirOrc(oid){
  confirmar('Excluir rascunho', 'O rascunho e os itens dele somem. Isso não tem volta.', 'Excluir', async () => {
    const ok = await act(async () => { await db.del('tdh_orcamentos', eqId(oid)); S.orcs = S.orcs.filter(o => o.id !== oid); S.itens = S.itens.filter(i => i.orcamento_id !== oid); return true; });
    if (ok) go('#/orcamentos');
  }, true);
}

/* ═══════════════════════════════════════════════════════════════════
   IMPORTAR ORÇAMENTO (JSON montado no Claude)
   O orçamento é montado na conversa com o Claude, que entrega um JSON no
   formato "tdh-orcamento-v1". Aqui você cola, confere e importa.

   Regras e o porquê de cada uma:
   - Entra SEMPRE como rascunho. O Claude pode errar valor ou item; o
     número só sai quando você emitir, depois de conferir no app.
   - Cliente é achado pelo WhatsApp (só dígitos, sem o 55). É o único dado
     que não se repete entre duas pessoas; nome se repete e é digitado de
     jeitos diferentes. Sem WhatsApp, usa o nome só se houver exatamente
     um cliente com ele; senão cadastra novo (melhor um duplicado visível
     do que juntar o orçamento na pessoa errada).
   - Cliente que já existe NÃO é sobrescrito: só campos vazios dele são
     preenchidos. O cadastro do app vale mais que o texto da conversa.
   - Preço: se o JSON trouxer preco_cliente, ele vale (é o preço que você
     combinou na conversa). Sem ele, usa a mesma regra do app (sugerido).
   - Se os itens falharem, o orçamento e o cliente recém-criados são
     apagados: não fica rascunho pela metade.
   ═══════════════════════════════════════════════════════════════════ */
let _imp = null; // resultado da conferência, usado pelo botão Importar

// Aceita o JSON puro ou dentro de um bloco ```json``` copiado da conversa.
function impParse(txt){
  let s = String(txt || '').trim();
  const bloco = s.match(/```(?:json)?\s*([\s\S]*?)```/i); if (bloco) s = bloco[1].trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('Não achei o JSON no texto colado.');
  let d; try { d = JSON.parse(s.slice(a, b + 1)); } catch(e) { throw new Error('O JSON está quebrado: ' + e.message); }
  if (d.formato && d.formato !== 'tdh-orcamento-v1') throw new Error('Formato desconhecido: ' + d.formato);
  return d;
}
// Valor pode vir como número (250) ou texto ("250,00", "R$ 1.200,50").
const impNum = v => typeof v === 'number' ? (isFinite(v) ? Math.round(v*100)/100 : 0) : parseMoney(v);
const impTxt = v => { const s = String(v ?? '').trim(); return s || null; };
// Tempo pode vir em minutos (90) ou texto ("1h30").
const impTempo = v => typeof v === 'number' ? Math.round(v) : parseTempo(v);

function impMontar(d){
  const cfg = S.cfg || {}, cl = d.cliente || {}, o = d.orcamento || {};
  const erros = [];
  const its = (Array.isArray(d.itens) ? d.itens : []).map((x, k) => {
    const tipo = x.tipo === 'custo_interno' ? 'custo_interno' : 'servico';
    const titulo = impTxt(x.titulo);
    if (!titulo) erros.push(`Item ${k + 1} sem título.`);
    const row = { tipo, titulo, ordem:k + 1, material_custo:impNum(x.material_custo), mao_obra:impNum(x.mao_obra) };
    if (row.material_custo < 0 || row.mao_obra < 0) erros.push(`Item ${k + 1} com valor negativo.`);
    if (tipo === 'servico') {
      row.descricao_cliente = impTxt(x.descricao_cliente);
      row.tempo_estimado_min = impTempo(x.tempo_estimado_min ?? x.tempo);
      row.margem_material_pct = x.margem_material_pct != null ? impNum(x.margem_material_pct) : num(cfg.margem_material_pct ?? 15);
      row.preco_cliente = x.preco_cliente != null && x.preco_cliente !== '' ? impNum(x.preco_cliente) : sugerido(row);
    } else {
      // Custo interno não tem descrição nem tempo, mas a linha precisa ter as
      // MESMAS chaves dos serviços: o Supabase grava todos os itens num insert
      // só e recusa ("All object keys must match") se uma linha tiver menos campos.
      row.descricao_cliente = null; row.tempo_estimado_min = null;
      row.margem_material_pct = 0; row.preco_cliente = 0;
    }
    return row;
  });
  if (!its.some(i => i.tipo === 'servico')) erros.push('Precisa de pelo menos um item de serviço.');

  const nome = impTxt(cl.nome), wa = onlyDigits(cl.whatsapp), base = foneBase(wa);
  if (!nome && !wa) erros.push('O cliente precisa de nome ou WhatsApp.');
  if (wa && base.length < 10) erros.push('WhatsApp do cliente sem DDD.');

  // Procura o cliente: WhatsApp primeiro; nome só se for único.
  let existe = null, como = '';
  if (base.length >= 10) { existe = S.clientes.find(c => foneBase(c.whatsapp) === base); como = 'pelo WhatsApp'; }
  if (!existe && !wa && nome) {
    const mesmos = S.clientes.filter(c => (c.nome || '').trim().toLowerCase() === nome.toLowerCase());
    if (mesmos.length === 1) { existe = mesmos[0]; como = 'pelo nome'; }
  }
  const dadosCli = { nome, whatsapp:wa || null, documento:impTxt(cl.documento), endereco:impTxt(cl.endereco),
    bairro:impTxt(cl.bairro), cidade:impTxt(cl.cidade), origem:impTxt(cl.origem), observacoes:impTxt(cl.observacoes) };
  // Só o que está vazio no cadastro e veio preenchido no JSON.
  const completar = {};
  if (existe) for (const k of ['nome','documento','endereco','bairro','cidade','origem'])
    if (!impTxt(existe[k]) && dadosCli[k]) completar[k] = dadosCli[k];

  const ref = existe ? { ...existe, ...completar } : dadosCli;
  const enderecoCli = [ref.endereco, ref.bairro, ref.cidade].filter(Boolean).join(', ') || null;
  const orcRow = {
    status:'rascunho',
    local_servico: impTxt(o.local_servico) || enderecoCli,
    subtitulo: impTxt(o.subtitulo) || 'Serviços de manutenção com fornecimento de material',
    validade_dias: o.validade_dias != null ? Math.round(impNum(o.validade_dias)) : (cfg.validade_dias ?? 15),
    garantia_dias: o.garantia_dias != null ? Math.round(impNum(o.garantia_dias)) : (cfg.garantia_dias ?? 90),
    entrada_valor: impNum(o.entrada_valor),
    // Textos padrão vêm da Configuração, como no "Novo orçamento". Só troca
    // se a conversa definiu um texto específico para este cliente.
    texto_execucao: impTxt(o.texto_execucao) || cfg.texto_execucao || null,
    texto_garantia: impTxt(o.texto_garantia) || cfg.texto_garantia || null,
    texto_imprevistos: impTxt(o.texto_imprevistos) || cfg.texto_imprevistos || null,
    observacoes_internas: [impTxt(o.observacoes_internas), 'Importado do Claude em ' + fmtData(hoje()) + '.'].filter(Boolean).join('\n'),
  };

  const total = its.filter(i => i.tipo === 'servico').reduce((s,i) => s + num(i.preco_cliente), 0);
  // Aviso de colagem repetida: mesmo cliente, mesmos títulos e mesmo total.
  let repetido = null;
  if (existe) {
    const chave = its.map(i => i.titulo).join('|');
    repetido = S.orcs.find(x => x.cliente_id === existe.id && itensDe(x.id).map(i => i.titulo).join('|') === chave
      && Math.abs(totaisOrc(x.id).total - total) < 0.01);
  }
  return { erros, its, existe, como, dadosCli, completar, orcRow, total, repetido };
}

function modalImportar(){
  _imp = null;
  openModal('Importar orçamento', `
    <p style="color:var(--text3);font-size:13px;margin:-6px 0 12px">Cole o JSON que o Claude gerou. Entra como <b>rascunho</b>: você confere e emite aqui.</p>
    <div class="field"><textarea class="in" id="imp-txt" style="min-height:180px;font-family:monospace;font-size:12.5px" placeholder='{"formato":"tdh-orcamento-v1", ...}'></textarea></div>
    <div class="btns" style="margin-bottom:12px">
      <button class="btn btn-s" onclick="impColar()">${ic('copy')} Colar</button>
      <button class="btn btn-n" style="flex:1" onclick="impConferir()">${ic('search')} Conferir</button></div>
    <div id="imp-prev"></div>`);
}
// Botão "Colar": no celular é mais fácil que segurar o dedo na caixa.
// Alguns navegadores bloqueiam; aí é colar na mão.
async function impColar(){
  try { $('imp-txt').value = await navigator.clipboard.readText(); impConferir(); }
  catch(e) { toast('O navegador não deixou colar. Segure o dedo na caixa e cole.', true); }
}
function impConferir(){
  const box = $('imp-prev'); _imp = null;
  let r;
  try { r = impMontar(impParse(fv('imp-txt'))); }
  catch(e) { box.innerHTML = `<div class="warn">${ic('alert')}<span>${esc(e.message)}</span></div>`; return; }
  if (r.erros.length) { box.innerHTML = `<div class="warn">${ic('alert')}<span>${r.erros.map(esc).join('<br>')}</span></div>`; return; }
  _imp = r;
  const c = r.existe, comp = Object.keys(r.completar);
  const cliHtml = c
    ? `Cliente já cadastrado (achado ${r.como}): <b>${esc(nomeC(c))}</b>${comp.length ? `<br><span style="font-size:12.5px">Vai completar: ${comp.map(k => ({ documento:'CPF/CNPJ', endereco:'endereço' })[k] || k).join(', ')}</span>` : ''}`
    : `Cliente novo: <b>${esc(r.dadosCli.nome || foneFmt(r.dadosCli.whatsapp))}</b>${r.dadosCli.whatsapp ? ' · ' + esc(foneFmt(r.dadosCli.whatsapp)) : ' · <b>sem WhatsApp</b>'}`;
  let n = 0;
  box.innerHTML = `
    ${r.repetido ? `<div class="warn">${ic('alert')}<span>Parece já importado: ${esc(numOrc(r.repetido))} tem o mesmo cliente, itens e total. <a href="#/orc/${r.repetido.id}" style="color:inherit;font-weight:700">Abrir</a></span></div>` : ''}
    <div class="card" style="margin-bottom:12px;font-size:14px;line-height:1.5">
      <div style="margin-bottom:8px">${cliHtml}</div>
      ${r.orcRow.local_servico ? `<div style="color:var(--text3);font-size:13px;margin-bottom:8px">Local: ${esc(r.orcRow.local_servico)}</div>` : ''}
      ${r.its.map(i => i.tipo === 'servico'
        ? `<div style="display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--line)"><span style="flex:1">${++n}. ${esc(i.titulo)}${i.tempo_estimado_min ? ` <span style="color:var(--text3)">· ${fmtTempo(i.tempo_estimado_min)}</span>` : ''}</span>${m$(i.preco_cliente)}</div>`
        : `<div style="display:flex;gap:8px;padding:4px 0;border-top:1px solid var(--line);color:var(--text3)"><span style="flex:1">${ic('lock')} ${esc(i.titulo)} (interno)</span>${m$(i.material_custo + i.mao_obra)}</div>`).join('')}
      <div style="display:flex;padding-top:8px;border-top:1px solid var(--line);font-weight:700"><span style="flex:1">Total ao cliente</span>${m$(r.total)}</div>
      ${num(r.orcRow.entrada_valor) ? `<div style="color:var(--text3);font-size:13px">Entrada: ${money(r.orcRow.entrada_valor)}</div>` : ''}
    </div>
    <button class="btn btn-p btn-w" onclick="impGravar()">${ic('check')} Importar como rascunho</button>`;
}

async function impGravar(){
  const r = _imp; if (!r) return;
  _imp = null; // evita gravar duas vezes com toque duplo
  let cliCriado = null, orcCriado = null;
  const oid = await act(async () => {
    try {
      let cid;
      if (r.existe) {
        cid = r.existe.id;
        if (Object.keys(r.completar).length) {
          const [n] = await db.upd('tdh_clientes', eqId(cid), r.completar); Object.assign(cliente(cid), n);
        }
      } else {
        const row = { ...r.dadosCli, status:'conversando' };
        const [n] = await db.ins('tdh_clientes', row); cliCriado = n; cid = n.id;
      }
      const cl = cliente(cid) || cliCriado;
      const [o] = await db.ins('tdh_orcamentos', { ...r.orcRow, cliente_id:cid, cliente_nome:cl?.nome || null });
      orcCriado = o;
      const its = await db.ins('tdh_orcamento_itens', r.its.map(i => ({ ...i, orcamento_id:o.id })));
      if (cliCriado) S.clientes.push(cliCriado);
      S.orcs.unshift(o); S.itens.push(...its);
      return o.id;
    } catch(e) {
      // Desfaz o que foi criado nesta importação (não mexe em cliente antigo).
      if (orcCriado) await db.del('tdh_orcamentos', eqId(orcCriado.id)).catch(() => {});
      if (cliCriado) await db.del('tdh_clientes', eqId(cliCriado.id)).catch(() => {});
      throw e;
    }
  }, 'Orçamento importado como rascunho.');
  // Falhou: libera o botão para tentar de novo sem colar outra vez.
  if (oid) { closeModal(); go('#/orc/' + oid); } else _imp = r;
}

/* ═══════════════════════════════════════════════════════════════════
   PDF DO ORÇAMENTO — mesmo layout do 653, com a logo da marca.
   As páginas são montadas em tamanho A4 real (794×1123 px) e os itens
   são distribuídos medindo a altura, para nunca cortar linha no meio.
   ═══════════════════════════════════════════════════════════════════ */
const LOGO_SRC = 'simbolo.svg';
function pdfLetterhead(){
  return `<div class="pdf-lh"><div class="b"><img src="${LOGO_SRC}" alt="">
    <div><div class="wm">Trabalho <span>de Homem</span><small>.CWB</small></div><div class="sl">${esc(EMPRESA.slogan)}</div></div></div>
    <div class="ct"><b>${esc(EMPRESA.nome)}</b><br>WhatsApp ${esc(EMPRESA.whats)}<br>${esc(EMPRESA.insta)}</div></div>`;
}
function novaPagina(root, rascunho){
  const pg = document.createElement('div'); pg.className = 'pdf-page';
  pg.innerHTML = `<div class="pdf-accent"></div><div class="pdf-in">${pdfLetterhead()}</div>
    <div class="pdf-foot"><div>Trabalho de Homem · Curitiba e região · ${esc(EMPRESA.insta)}</div><div class="pn"></div></div>
    ${rascunho ? '<div class="pdf-draft">RASCUNHO</div>' : ''}`;
  root.appendChild(pg); return pg.querySelector('.pdf-in');
}
const cabe = el => el.scrollHeight <= el.clientHeight + 1;
// Põe um bloco na página atual; se não couber, abre página nova.
function poe(ctx, html){
  const tmp = document.createElement('div'); tmp.innerHTML = html; const el = tmp.firstElementChild;
  ctx.body.appendChild(el);
  if (!cabe(ctx.body) && ctx.body.children.length > 1) { el.remove(); ctx.body = novaPagina(ctx.root, ctx.rasc); ctx.body.appendChild(el); }
  return el;
}
function textoGarantia(o){ return String(o.texto_garantia || '').replace(/\{garantia\}/g, num(o.garantia_dias)); }

async function montarPdf(oid, root){
  const o = orc(oid), t = totaisOrc(oid), its = itensDe(oid).filter(i => i.tipo === 'servico'), c = cliente(o.cliente_id);
  const rasc = o.status === 'rascunho';
  const emissao = o.emissao || hoje(), validade = addDias(emissao, num(o.validade_dias));
  const nomeCli = o.cliente_nome || c?.nome || '—';
  root.innerHTML = '';
  await document.fonts.ready;
  const ctx = { root, rasc, body:novaPagina(root, rasc) };
  poe(ctx, `<div class="pdf-title"><div><h1>ORÇAMENTO</h1><p>${esc(o.subtitulo || '')}</p></div>
    <div class="pdf-meta"><span>Nº</span><b>${rasc ? 'rascunho' : numOrc(o)}</b><span>Emissão</span><b>${fmtData(emissao)}</b>
    <span>Validade</span><b>${fmtData(validade)} (${num(o.validade_dias)} dias)</b><span>Cliente</span><b>${esc(nomeCli)}</b>
    ${o.local_servico ? `<span>Local</span><b>${esc(o.local_servico)}</b>` : ''}</div></div>`);
  // Tabela: uma por página, com o cabeçalho repetido na continuação.
  const head = `<thead><tr><th>#</th><th>Serviço (material incluso)</th><th class="v">Valor</th></tr></thead>`;
  let tb = poe(ctx, `<table class="pdf-t">${head}<tbody></tbody></table>`).querySelector('tbody');
  its.forEach((it, k) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="n">${k+1}</td><td><div class="it">${esc(it.titulo)}</div>${it.descricao_cliente ? `<div class="ds">${esc(it.descricao_cliente)}</div>` : ''}</td><td class="v">${money(it.preco_cliente)}</td>`;
    tb.appendChild(tr);
    if (!cabe(ctx.body) && tb.children.length > 1) {
      tr.remove(); ctx.body = novaPagina(root, rasc);
      tb = poe(ctx, `<table class="pdf-t">${head}<tbody></tbody></table>`).querySelector('tbody'); tb.appendChild(tr);
    }
  });
  poe(ctx, `<div class="pdf-total"><div><span>TOTAL</span><b>${money(t.total)}</b></div></div>`);

  // Condições começam sempre em página própria, como no 653.
  ctx.body = novaPagina(root, rasc);
  poe(ctx, `<div class="pdf-h2">CONDIÇÕES DO ORÇAMENTO${rasc ? '' : ' Nº ' + numOrc(o)}</div>`);
  const ent = num(o.entrada_valor), cfg = S.cfg || {};
  const pix = cfg.pix_chave ? ` Pagamento via PIX, chave ${esc(cfg.pix_tipo || '')} <b>${esc(cfg.pix_chave)}</b>.` : '';
  const pag = ent > 0 && ent < t.total
    ? `Entrada de <b>${money(ent)}</b> na aprovação do orçamento, destinada à compra do material e à logística. Saldo de <b>${money(t.total - ent)}</b> na conclusão dos serviços.${pix}`
    : `Pagamento de <b>${money(t.total)}</b> na conclusão dos serviços.${pix}`;
  const blocos = [
    ['Execução', esc(o.texto_execucao || '')],
    ['Pagamento', pag],
    ['Validade', `Este orçamento é válido por ${num(o.validade_dias)} dias a partir da emissão, até ${fmtData(validade)}. Após esse prazo, valores de material podem ser revistos.`],
    ['Garantia', esc(textoGarantia(o))],
    ['Imprevistos e serviços adicionais', esc(o.texto_imprevistos || '')],
  ].filter(b => b[1]);
  blocos.forEach(([h, tx]) => poe(ctx, `<div class="pdf-cl"><h4>${h}</h4><div>${tx}</div></div>`));
  poe(ctx, `<div class="pdf-box"><span>Valor total dos serviços, com material incluso</span><b>${money(t.total)}</b></div>`);
  poe(ctx, `<div class="pdf-sign"><h4>Aceite</h4><p>De acordo com os serviços, valores e condições acima.</p>
    <div class="g"><div><b>Trabalho de Homem${cfg.cnpj ? ' · CNPJ ' + esc(cfg.cnpj) : ''}</b><br><span>${esc(EMPRESA.nome)}</span></div>
    <div><b>${esc(nomeCli)}</b>${c?.documento ? '<br><span>' + esc(c.documento) + '</span>' : ''}<br><span>Contratante · Data: ____/____/______</span></div></div></div>`);
  const pgs = root.querySelectorAll('.pdf-page');
  pgs.forEach((p, k) => p.querySelector('.pn').textContent = `Página ${k+1} de ${pgs.length}`);
}

let pdfOid = null;
async function abrirPdf(oid){
  const o = orc(oid); if (!o) return;
  pdfOid = oid; closePdf();
  const w = document.createElement('div'); w.id = 'pdf-wrap';
  w.innerHTML = `<div id="pdf-bar"><button class="icon-btn" onclick="voltarPdf()">${ic('left')}</button>
    <div class="t">${o.numero ? 'Orçamento ' + numOrc(o) : 'Prévia do rascunho'}</div>
    <button class="btn btn-sm btn-p" onclick="compartilharPdf()">${ic('share')} Enviar</button>
    <button class="icon-btn" title="Imprimir / salvar PDF" onclick="window.print()">${ic('print')}</button></div>
    <div id="pdf-scroll"><div id="pdf-scale"></div></div>`;
  document.body.appendChild(w);
  const root = $('pdf-scale');
  await montarPdf(oid, root);
  ajustaEscalaPdf();
}
// Escala só na tela; na impressão e na geração do PDF a página volta ao
// tamanho real (ver @media print e compartilharPdf).
function ajustaEscalaPdf(){
  const sc = $('pdf-scroll'), root = $('pdf-scale'); if (!sc || !root) return;
  const s = Math.min(1, (sc.clientWidth - 24) / 794), n = root.children.length;
  root.style.transform = `scale(${s})`; root.style.width = '794px';
  root.style.height = (n * (1123 + 18)) * s + 'px'; root.style.marginLeft = Math.max(12, (sc.clientWidth - 794*s)/2) + 'px';
}
window.addEventListener('resize', ajustaEscalaPdf);
function closePdf(){ const w = $('pdf-wrap'); if (w) w.remove(); }
// Voltar do PDF: se você chegou pelo app, volta uma tela (o botão do
// Android faz o mesmo). Se abriu o link do PDF direto, vai para o editor.
let navegou = 0; window.addEventListener('hashchange', () => navegou++);
function voltarPdf(){ if (navegou > 0) history.back(); else location.replace('#/orc/' + pdfOid); }

const loadScript = src => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok();
  const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Sem internet para gerar o PDF.')); document.head.appendChild(s); });

// Gera o arquivo PDF no próprio celular e abre o "compartilhar" do Android
// (WhatsApp, e-mail…). Bibliotecas carregam só aqui, para o app abrir rápido.
async function compartilharPdf(){
  const o = orc(pdfOid); if (!o) return;
  if (o.status === 'rascunho') { toast('Emita o orçamento antes de enviar: rascunho não tem número.', true); return; }
  const nome = `Orcamento-${numOrc(o).replace('/', '-')}-Trabalho-de-Homem.pdf`;
  await act(async () => {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const root = $('pdf-scale'), tf = root.style.transform; root.style.transform = 'none';
    try {
      const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4', compress:true });
      const pgs = [...root.querySelectorAll('.pdf-page')];
      for (let k = 0; k < pgs.length; k++) {
        const cv = await html2canvas(pgs[k], { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false });
        if (k) pdf.addPage();
        pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
      }
      const blob = pdf.output('blob'), file = new File([blob], nome, { type:'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file], title:nome }); } catch(e) { if (e.name !== 'AbortError') throw e; }
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }
    } finally { root.style.transform = tf; }
  });
}

    feitos:s => s.status === 'executado', todos:() => true };
  const b = servBusca.toLowerCase();
  const lista = S.servicos.filter(F[servFiltro]).filter(s => !b || (s.descricao + ' ' + (cliente(s.cliente_id)?.nome || '') + ' ' + (s.bairro || '')).toLowerCase().includes(b));

function filtraServ(){ const y = window.scrollY; const v = servBusca; render(); const inp = document.querySelector('.search input'); if (inp) { inp.focus(); inp.setSelectionRange(v.length, v.length); } window.scrollTo(0, y); }
function rowServ(s){
  const c = cliente(s.cliente_id), t = totaisServ(s.id), ag = agendasDe(s.id), prox = ag.find(a => a.data >= hoje()) || ag[ag.length-1];
